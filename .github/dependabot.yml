version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    # Let new action releases age a week before proposing them.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directories: ["/apps", "/apps/dashboard", "/apps/mobile"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      apps-minor:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule:
      interval: weekly
