version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    # Let new action releases age a week before proposing them.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # /apps is one npm workspace with a single package-lock.json: watching the
  # workspace directories too only produces duplicate pull requests.
  - package-ecosystem: npm
    directory: /apps
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      apps-minor:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule:
      interval: weekly
