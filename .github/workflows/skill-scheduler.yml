name: Skill Scheduler
# Runs catalogue skills that have a `schedule: <key>` trigger. Each cron line
# carries its key; `squadhq render` may rewrite the times, so the key is read
# back from this file at run time (the line whose cron fired). Skills that are
# disabled (squadhq.yml, or vars.SQUADHQ_DISABLED_AGENTS) never run.
on:
  schedule:
    - cron: "*/15 * * * *"  # squadhq:schedule:uptime_watch (every 15m Europe/London -> UTC+01:00; run 1h earlier local time outside DST)
    - cron: "30 4 * * 1"  # squadhq:schedule:weekly_dependencies (mon 05:30 Europe/London -> UTC+01:00; run 1h earlier local time outside DST)
    - cron: "0 2 * * 6"  # squadhq:schedule:weekly_dast (sat 03:00 Europe/London -> UTC+01:00; run 1h earlier local time outside DST)
    - cron: "0 5 * * 1"  # squadhq:schedule:weekly_test_health (mon 06:00 Europe/London -> UTC+01:00; run 1h earlier local time outside DST)
    - cron: "0 9 * * 2,4"  # squadhq:schedule:release_train (tue,thu 10:00 Europe/London -> UTC+01:00; run 1h earlier local time outside DST)
    - cron: "0 7 * * 1"  # squadhq:schedule:finops_weekly (mon 08:00 Europe/London -> UTC+01:00; run 1h earlier local time outside DST)
    - cron: "0 13 1 1,4,7,10 *"  # squadhq:schedule:quarterly_okr_draft (quarterly 1st 14:00 Europe/London -> UTC+01:00; run 1h earlier local time outside DST)
    - cron: "0 8 * * 5"  # squadhq:schedule:weekly_feedback (fri 09:00 Europe/London -> UTC+01:00; run 1h earlier local time outside DST)
    - cron: "0 8 2 * *"  # squadhq:schedule:monthly_competitive (monthly 2nd 09:00 Europe/London -> UTC+01:00; run 1h earlier local time outside DST)
    - cron: "0 4 * * 0"  # squadhq:schedule:weekly_prompt_eval (sun 05:00 Europe/London -> UTC+01:00; run 1h earlier local time outside DST)
    - cron: "0 8 3 * *"  # squadhq:schedule:monthly_model_routing (monthly 3rd 09:00 Europe/London -> UTC+01:00; run 1h earlier local time outside DST)
    - cron: "0 9 2 * *"  # squadhq:schedule:compliance_monthly (monthly 2nd 10:00 Europe/London -> UTC+01:00; run 1h earlier local time outside DST)
    - cron: "30 6 * * 1"  # squadhq:schedule:analytics_weekly (mon 07:30 Europe/London -> UTC+01:00; run 1h earlier local time outside DST)
    - cron: "0 4 * * 3"  # squadhq:schedule:docs_gardener (wed 05:00 Europe/London -> UTC+01:00; run 1h earlier local time outside DST)
    - cron: "0 4 * * 4"  # squadhq:schedule:weekly_localisation (thu 05:00 Europe/London -> UTC+01:00; run 1h earlier local time outside DST)
  workflow_dispatch:
    inputs:
      key:
        description: Schedule key to run now (e.g. weekly_dependencies)
        required: true
        type: string

permissions: {}

env:
  SQUADHQ_AGENT_APP_CLIENT_ID: ${{ vars.SQUADHQ_AGENT_APP_CLIENT_ID }}
  SQUADHQ_AGENT_BOT_LOGIN: ${{ vars.SQUADHQ_AGENT_BOT_LOGIN || 'squadhq-agent[bot]' }}
  # Token-broker mode (ADR-0011): App tokens come from this broker via OIDC.
  SQUADHQ_TOKEN_BROKER: ${{ vars.SQUADHQ_TOKEN_BROKER }}
  SQUADHQ_TOKEN_BROKER_AUDIENCE: ${{ vars.SQUADHQ_TOKEN_BROKER_AUDIENCE }}
  PYTHONSAFEPATH: "1"

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      schedule: ${{ steps.key.outputs.schedule }}
      skills: ${{ steps.match.outputs.skills }}
      count: ${{ steps.match.outputs.count }}
      uptime: ${{ steps.uptime.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-hub
        with:
          token: ${{ github.token }}
          hub-repo: ${{ github.repository }}
          hub-path: .
      - id: key
        name: Which schedule fired?
        env:
          FIRED: ${{ github.event.schedule }}
          INPUT_KEY: ${{ inputs.key }}
        run: |
          key="$INPUT_KEY"
          if [ -z "$key" ]; then
            key=$(python -I - <<'PY'
          import os, re
          fired = os.environ["FIRED"].strip()
          for line in open(".github/workflows/skill-scheduler.yml", encoding="utf-8"):
              m = re.search(r'cron:\s*"([^"]+)"\s*#\s*squadhq:schedule:([a-z0-9_]+)', line)
              if m and m.group(1).strip() == fired:
                  print(m.group(2)); break
          PY
            )
          fi
          [[ "$key" =~ ^[a-z0-9_]+$ ]] || { echo "::error::no schedule key for '$FIRED'"; exit 1; }
          echo "schedule=$key" >> "$GITHUB_OUTPUT"
          echo "Schedule key: \`$key\`" >> "$GITHUB_STEP_SUMMARY"
      - id: match
        uses: ./.github/actions/skill-resolve
        with:
          mode: match
          event: schedule
          value: ${{ steps.key.outputs.schedule }}
          disabled-agents: ${{ vars.SQUADHQ_DISABLED_AGENTS }}
      - id: uptime
        name: Uptime watcher enabled? (deterministic skill)
        env:
          KEY: ${{ steps.key.outputs.schedule }}
          DISABLED: ${{ vars.SQUADHQ_DISABLED_AGENTS }}
        run: |
          enabled=false
          if [ "$KEY" = uptime_watch ] && [ -f squadhq.yml ]; then
            case ",${DISABLED// /}," in *",uptime-watcher,"*|*",uptime_watch,"*) ;; *)
              on=$(python -P -m squadhq.skills list --enabled-for squadhq.yml --format json \
                | python -I -c 'import json,sys; print(any(s["id"] == "uptime-watcher" and s["enabled"] for s in json.load(sys.stdin)))')
              [ "$on" = True ] && enabled=true ;;
            esac
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"

  uptime:
    needs: resolve
    if: needs.resolve.outputs.uptime == 'true'
    concurrency:
      group: squadhq-uptime
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write  # token broker (squadhq-token, ADR-0011)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: hub
        uses: ./.github/actions/setup-hub
        with:
          app-client-id: ${{ vars.SQUADHQ_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.SQUADHQ_APP_PRIVATE_KEY }}
          hub-repo: ${{ github.repository }}
          hub-path: .
          bot-login: ${{ vars.SQUADHQ_BOT_LOGIN }}
          repositories: "@projects"
          # contents:write — state/uptime.json is saved through the Contents API.
          permission-contents: write
          permission-issues: write
      - name: Probe and apply incident actions
        env:
          GH_TOKEN: ${{ steps.hub.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$REPO/contents/state/uptime.json" --jq .sha 2>/dev/null || true)
          if [ -n "$sha" ]; then gh api "repos/$REPO/contents/state/uptime.json" --jq .content | base64 -d > "$RUNNER_TEMP/uptime.json"; fi
          python -P -m squadhq.skills.uptime run --config squadhq.yml --state "$RUNNER_TEMP/uptime.json" > "$RUNNER_TEMP/actions.json"
          python - "$RUNNER_TEMP/actions.json" "$RUNNER_TEMP/uptime.json" <<'PY'
          import json, os, subprocess, sys
          hub = os.environ["REPO"]
          report = json.load(open(sys.argv[1]))
          state = json.load(open(sys.argv[2])) if os.path.exists(sys.argv[2]) else {}
          def gh(*args):
              return subprocess.run(["gh", *args], capture_output=True, text=True, timeout=60)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s:
              for r in report.get("results", []):
                  s.write(f"- {'✅' if r.get('ok') else '❌'} {r.get('name', r.get('check', '?'))}\n")
              for a in report.get("actions", []):
                  repo = a.get("repo") or hub
                  if a["type"] == "open_incident":
                      cmd = ["issue", "create", "-R", repo, "-t", a["title"], "-b", a["body"]]
                      for lab in a.get("labels") or []:
                          cmd += ["-l", lab]
                      r = gh(*cmd)
                      if r.returncode != 0 and a.get("labels"):
                          r = gh("issue", "create", "-R", repo, "-t", a["title"], "-b", a["body"])
                      url = r.stdout.strip()
                      if url:
                          state.setdefault(a["check"], {})["issue"] = int(url.rsplit("/", 1)[-1])
                          state[a["check"]]["issue_repo"] = repo
                      s.write(f"- opened incident for {a['check']}: {url or r.stderr.strip()}\n")
                  elif a["type"] in ("close_incident", "comment_recovered") and a.get("issue"):
                      repo = (state.get(a["check"]) or {}).get("issue_repo", repo)
                      gh("issue", "comment", str(a["issue"]), "-R", repo, "-b", a["body"])
                      if a["type"] == "close_incident":
                          gh("issue", "close", str(a["issue"]), "-R", repo)
                      s.write(f"- {a['type']} {a['check']} (#{a['issue']})\n")
          json.dump(state, open(sys.argv[2], "w"), indent=2, sort_keys=True)
          PY
          # Compare-and-set on the blob sha: a concurrent writer makes this fail loudly.
          content=$(base64 -w0 < "$RUNNER_TEMP/uptime.json")
          gh api -X PUT "repos/$REPO/contents/state/uptime.json" -f message="chore: uptime state" \
            -f content="$content" ${sha:+-f sha="$sha"} > /dev/null
      - if: failure()
        uses: ./.github/actions/escalate
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PAGERDUTY_ROUTING_KEY: ${{ secrets.PAGERDUTY_ROUTING_KEY }}
          SQUADHQ_WEBHOOK_URL: ${{ secrets.SQUADHQ_WEBHOOK_URL }}
          SQUADHQ_WEBHOOK_SECRET: ${{ secrets.SQUADHQ_WEBHOOK_SECRET }}
        with:
          notify-targets: ${{ vars.SQUADHQ_NOTIFY_ESCALATIONS }}
          token: ${{ steps.hub.outputs.token }}
          title: "Workflow failed: uptime watcher"
      - id: broker-revoke
        if: always() && env.SQUADHQ_TOKEN_BROKER != ''
        name: Revoke this job's token-broker tokens (App-key mode revokes at job end too)
        continue-on-error: true
        run: |
          f="$RUNNER_TEMP/squadhq-broker-tokens"
          [ -f "$f" ] || exit 0
          while IFS= read -r t; do
            [ -n "$t" ] && curl -sS -o /dev/null -X DELETE -H "Authorization: Bearer $t" \
              -H "Accept: application/vnd.github+json" https://api.github.com/installation/token || true
          done < "$f"
          rm -f "$f"

  skill:
    needs: resolve
    if: needs.resolve.outputs.count != '0' && needs.resolve.outputs.count != ''
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJSON(needs.resolve.outputs.skills) }}
    permissions:
      contents: read
      id-token: write  # token broker (squadhq-token, ADR-0011)
    uses: ./.github/workflows/agent-run.yml
    with:
      key: ${{ matrix.skill }}
      instance: skill-${{ matrix.skill }}
      role: ${{ matrix.skill }}
      skill: ${{ matrix.skill }}
      skill-event: schedule:${{ needs.resolve.outputs.schedule }}
      project-list: ${{ 'true' }}
      agent-repositories: "@projects"
      permission-contents: read
      permission-issues: write
      permission-pull-requests: write
      timeout-minutes: 60
    secrets:
      SQUADHQ_APP_PRIVATE_KEY: ${{ secrets.SQUADHQ_APP_PRIVATE_KEY }}
      SQUADHQ_AGENT_APP_PRIVATE_KEY: ${{ secrets.SQUADHQ_AGENT_APP_PRIVATE_KEY }}
      SQUADHQ_HANDOFF_KEY: ${{ secrets.SQUADHQ_HANDOFF_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY_1: ${{ secrets.ANTHROPIC_API_KEY_1 }}
      ANTHROPIC_API_KEY_2: ${{ secrets.ANTHROPIC_API_KEY_2 }}
      ANTHROPIC_API_KEY_3: ${{ secrets.ANTHROPIC_API_KEY_3 }}
      ANTHROPIC_API_KEY_4: ${{ secrets.ANTHROPIC_API_KEY_4 }}
      ANTHROPIC_API_KEY_5: ${{ secrets.ANTHROPIC_API_KEY_5 }}
      CLAUDE_CODE_OAUTH_TOKEN_1: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_1 }}
      CLAUDE_CODE_OAUTH_TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
      CLAUDE_CODE_OAUTH_TOKEN_3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_3 }}
      CLAUDE_CODE_OAUTH_TOKEN_4: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_4 }}
      CLAUDE_CODE_OAUTH_TOKEN_5: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_5 }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      PAGERDUTY_ROUTING_KEY: ${{ secrets.PAGERDUTY_ROUTING_KEY }}
      SQUADHQ_WEBHOOK_URL: ${{ secrets.SQUADHQ_WEBHOOK_URL }}
      SQUADHQ_WEBHOOK_SECRET: ${{ secrets.SQUADHQ_WEBHOOK_SECRET }}
