name: Stub Sync
# Opens a PR in every project whose .github/workflows/agents.yml differs from
# onboarding/agents.yml.stub rendered for this hub. A release bumps the pin:
# the stub is rendered with the release tag.
on:
  push:
    branches: [main]
    # The manifest changes when a hub upgrade (squadhq.hub_upgrade) is merged; the label
    # registry and the project list decide which labels every repository needs.
    paths: ["onboarding/agents.yml.stub", ".github/squadhq-manifest.json", "config/flows.yml",
            "config/projects.json"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only report which projects are out of date
        type: boolean
        default: false
      ref:
        description: Hub ref to pin in the stub (default the latest release, else vars.SQUADHQ_HUB_REF)
        required: false
        default: ""

permissions: {}

env:
  SQUADHQ_AGENT_APP_CLIENT_ID: ${{ vars.SQUADHQ_AGENT_APP_CLIENT_ID }}
  SQUADHQ_AGENT_BOT_LOGIN: ${{ vars.SQUADHQ_AGENT_BOT_LOGIN || 'squadhq-agent[bot]' }}
  # Earlier bot logins whose comments still count as ours (e.g. after moving to a new App).
  SQUADHQ_BOT_ALIASES: ${{ vars.SQUADHQ_BOT_ALIASES }}
  # Token-broker mode (ADR-0011): App tokens come from this broker via OIDC.
  SQUADHQ_TOKEN_BROKER: ${{ vars.SQUADHQ_TOKEN_BROKER }}
  SQUADHQ_TOKEN_BROKER_AUDIENCE: ${{ vars.SQUADHQ_TOKEN_BROKER_AUDIENCE }}
  # The checkout never shadows Python modules (CWD is not put on sys.path).
  PYTHONSAFEPATH: "1"

concurrency:
  group: squadhq-stub-sync
  cancel-in-progress: false

jobs:
  sync:
    # No App and no token broker configured (e.g. the template source repository): nothing to do.
    if: (vars.SQUADHQ_APP_CLIENT_ID != '' || vars.SQUADHQ_TOKEN_BROKER != '')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write  # token broker (squadhq-token, ADR-0011)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: hub
        uses: ./.github/actions/setup-hub
        with:
          app-client-id: ${{ vars.SQUADHQ_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.SQUADHQ_APP_PRIVATE_KEY }}
          hub-repo: ${{ github.repository }}
          hub-path: .
          bot-login: ${{ vars.SQUADHQ_BOT_LOGIN }}
          repositories: "@projects"
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
          # Label sync creates missing labels on the hub and the projects.
          permission-issues: write
      - id: ref
        name: Hub ref to pin
        env:
          GH_TOKEN: ${{ github.token }}
          IN_REF: ${{ inputs.ref }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          VAR_REF: ${{ vars.SQUADHQ_HUB_REF }}
          REPO: ${{ github.repository }}
        run: |
          ref="${IN_REF:-$RELEASE_TAG}"
          [ -z "$ref" ] && ref=$(gh release view -R "$REPO" --json tagName --jq .tagName 2>/dev/null || true)
          ref="${ref:-${VAR_REF:-main}}"
          [[ "$ref" =~ ^[A-Za-z0-9_./-]+$ ]] || { echo "::error::invalid ref '$ref'"; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Pinning stubs to \`$ref\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Sync stubs
        env:
          GH_TOKEN: ${{ steps.hub.outputs.token }}
          SQUADHQ_STUB_REF: ${{ steps.ref.outputs.ref }}
          # Opt-in: projects track this hub branch instead of a pinned commit (no pin PRs).
          SQUADHQ_STUB_FOLLOW: ${{ vars.SQUADHQ_STUB_FOLLOW }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: python -P -m squadhq.stub_sync ${DRY_RUN:+"$DRY_RUN"}
      - name: Sync labels
        if: "!cancelled()"
        env:
          GH_TOKEN: ${{ steps.hub.outputs.token }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: python -P -m squadhq.label_sync ${DRY_RUN:+"$DRY_RUN"}
      - if: always()
        uses: ./.github/actions/agent-post
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PAGERDUTY_ROUTING_KEY: ${{ secrets.PAGERDUTY_ROUTING_KEY }}
          SQUADHQ_WEBHOOK_URL: ${{ secrets.SQUADHQ_WEBHOOK_URL }}
          SQUADHQ_WEBHOOK_SECRET: ${{ secrets.SQUADHQ_WEBHOOK_SECRET }}
        with:
          notify-targets: ${{ vars.SQUADHQ_NOTIFY_ESCALATIONS }}
          job: stub-sync
          ops-token: ${{ steps.hub.outputs.token }}
          job-status: ${{ job.status }}
          failure-mode: cron
          ledger: "false"
          summary: "false"
      - id: broker-revoke
        if: always() && env.SQUADHQ_TOKEN_BROKER != ''
        name: Revoke this job's token-broker tokens (App-key mode revokes at job end too)
        continue-on-error: true
        run: |
          f="$RUNNER_TEMP/squadhq-broker-tokens"
          [ -f "$f" ] || exit 0
          while IFS= read -r t; do
            if [ -n "$t" ]; then
              curl -sS -o /dev/null -X DELETE -H "Authorization: Bearer $t" \
                -H "Accept: application/vnd.github+json" https://api.github.com/installation/token || true
            fi
          done < "$f"
          rm -f "$f"
