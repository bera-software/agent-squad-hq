name: Scorecard
# OpenSSF Scorecard for this repository: publishes the results behind the README badge
# and uploads them to code scanning. Not copied into scaffolded hubs
# (squadhq.config.scaffold.PROJECT_ONLY).
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch: {}

permissions: {}

jobs:
  analysis:
    # The project's own supply-chain report: never run in a hub created from the template.
    if: github.repository == 'bera-software/agent-squad-hq'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
