name: Hub Janitor
# Keeps the hub's issue list useful: merges identical-title duplicates and
# closes dated reports past retention; retires department reports in project
# repos after 14 days. Deterministic, no LLM. Rules: config/flows.yml
# flood-guards.hub_janitor.
on:
  schedule:
    - cron: "45 5 * * *"  # squadhq:schedule:hub_janitor (daily 06:45 Europe/London -> UTC+01:00; run 1h earlier local time outside DST)
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only report what would be closed or merged
        type: boolean
        default: true

permissions: {}

env:
  SQUADHQ_AGENT_APP_CLIENT_ID: ${{ vars.SQUADHQ_AGENT_APP_CLIENT_ID }}
  SQUADHQ_AGENT_BOT_LOGIN: ${{ vars.SQUADHQ_AGENT_BOT_LOGIN || 'squadhq-agent[bot]' }}
  # Earlier bot logins (ops, agent) whose items still count as ours (e.g. after moving to new Apps).
  SQUADHQ_BOT_ALIASES: ${{ vars.SQUADHQ_BOT_ALIASES }}
  SQUADHQ_AGENT_BOT_ALIASES: ${{ vars.SQUADHQ_AGENT_BOT_ALIASES }}
  # Token-broker mode (ADR-0011): App tokens come from this broker via OIDC.
  SQUADHQ_TOKEN_BROKER: ${{ vars.SQUADHQ_TOKEN_BROKER }}
  SQUADHQ_TOKEN_BROKER_AUDIENCE: ${{ vars.SQUADHQ_TOKEN_BROKER_AUDIENCE }}
  # The checkout never shadows Python modules (CWD is not put on sys.path).
  PYTHONSAFEPATH: "1"

concurrency:
  group: squadhq-hub-janitor
  cancel-in-progress: false

jobs:
  clean:
    # No App and no token broker configured (e.g. the template source repository): nothing to do.
    if: (vars.SQUADHQ_APP_CLIENT_ID != '' || vars.SQUADHQ_TOKEN_BROKER != '') && (!contains(format(',{0},', vars.SQUADHQ_DISABLED_AGENTS), ',hub_janitor,'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      id-token: write  # token broker (squadhq-token, ADR-0011)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: hub
        uses: ./.github/actions/setup-hub
        with:
          app-client-id: ${{ vars.SQUADHQ_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.SQUADHQ_APP_PRIVATE_KEY }}
          hub-repo: ${{ github.repository }}
          hub-path: .
          bot-login: ${{ vars.SQUADHQ_BOT_LOGIN }}
          repositories: "@projects"
          permission-contents: read
          permission-issues: write
      # GITHUB_TOKEN on purpose for the hub: its comments and closes never
      # trigger other workflows (e.g. the concierge).
      - name: Clean hub issues
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: python -P -m squadhq.hub_janitor ${DRY_RUN:+"$DRY_RUN"}
      # Project repos need the App token; closes carry no comment, so no
      # issue_comment event wakes a project's agents stub.
      - name: Clean project report issues
        env:
          GH_TOKEN: ${{ steps.hub.outputs.token }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: python -P -m squadhq.hub_janitor --scope projects ${DRY_RUN:+"$DRY_RUN"}
      - if: always()
        uses: ./.github/actions/agent-post
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PAGERDUTY_ROUTING_KEY: ${{ secrets.PAGERDUTY_ROUTING_KEY }}
          SQUADHQ_WEBHOOK_URL: ${{ secrets.SQUADHQ_WEBHOOK_URL }}
          SQUADHQ_WEBHOOK_SECRET: ${{ secrets.SQUADHQ_WEBHOOK_SECRET }}
        with:
          notify-targets: ${{ vars.SQUADHQ_NOTIFY_ESCALATIONS }}
          job: hub-janitor
          ops-token: ${{ steps.hub.outputs.token }}
          job-status: ${{ job.status }}
          failure-mode: cron
          ledger: "false"
          summary: "false"
      - id: broker-revoke
        if: always() && env.SQUADHQ_TOKEN_BROKER != ''
        name: Revoke this job's token-broker tokens (App-key mode revokes at job end too)
        continue-on-error: true
        run: |
          f="$RUNNER_TEMP/squadhq-broker-tokens"
          [ -f "$f" ] || exit 0
          while IFS= read -r t; do
            if [ -n "$t" ]; then
              curl -sS -o /dev/null -X DELETE -H "Authorization: Bearer $t" \
                -H "Accept: application/vnd.github+json" https://api.github.com/installation/token || true
            fi
          done < "$f"
          rm -f "$f"
