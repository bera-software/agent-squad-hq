name: OKR Tracker
on:
  schedule:
    - cron: "0 4 * * 5"  # squadhq:schedule:okr_tracker (fri 05:00 Europe/London -> UTC+01:00; run 1h earlier local time outside DST)
  workflow_dispatch: {}

permissions: {}

env:
  SQUADHQ_AGENT_APP_CLIENT_ID: ${{ vars.SQUADHQ_AGENT_APP_CLIENT_ID }}
  SQUADHQ_AGENT_BOT_LOGIN: ${{ vars.SQUADHQ_AGENT_BOT_LOGIN || 'squadhq-agent[bot]' }}
  # Earlier bot logins (ops, agent) whose items still count as ours (e.g. after moving to new Apps).
  SQUADHQ_BOT_ALIASES: ${{ vars.SQUADHQ_BOT_ALIASES }}
  SQUADHQ_AGENT_BOT_ALIASES: ${{ vars.SQUADHQ_AGENT_BOT_ALIASES }}
  # Token-broker mode (ADR-0011): App tokens come from this broker via OIDC.
  SQUADHQ_TOKEN_BROKER: ${{ vars.SQUADHQ_TOKEN_BROKER }}
  SQUADHQ_TOKEN_BROKER_AUDIENCE: ${{ vars.SQUADHQ_TOKEN_BROKER_AUDIENCE }}
  PYTHONSAFEPATH: "1"

concurrency:
  group: squadhq-okr_tracker
  cancel-in-progress: false

jobs:
  run:
    permissions:
      contents: read
      id-token: write  # token broker (squadhq-token, ADR-0011)
    uses: ./.github/workflows/agent-run.yml
    with:
      key: okr_tracker
      instance: okr-track
      role: okr-track
      label-guard-role: okr-tracker
      tool-profile: edit-test
      extra-tools: Bash(git fetch *),Bash(gh issue create *),Bash(gh issue list *),Bash(gh search *),Bash(date *)
      agent-repositories: "@projects"
      permission-contents: read
      permission-issues: write
      permission-pull-requests: read
      deliver: pr
      deliver-prefix: okr-progress-
      deliver-allowed: '^org/strategy/okrs\.md$'
      prompt: |
        AUTOMATED UNATTENDED RUN. Nobody will answer questions: if blocked, say so in the PR body file and finish.
        Read agents/okr-tracker/prompt.md and follow it. Hub repo: ${{ github.repository }}. Registered projects: config/projects.json. Today: run `date -u +%Y-%m-%d`.
        DELIVERY (overrides any branch/commit/push/PR step in that prompt): only edit the files, then write the PR title to /tmp/pr-title.txt and the PR body to /tmp/pr-body.md. Do NOT create branches, commit, push or open the PR: the workflow validates your change and does all of that. If nothing needs to change, edit nothing.
        Never merge. Never modify a workflow, prompt or config file.
    secrets:
      SQUADHQ_APP_PRIVATE_KEY: ${{ secrets.SQUADHQ_APP_PRIVATE_KEY }}
      SQUADHQ_AGENT_APP_PRIVATE_KEY: ${{ secrets.SQUADHQ_AGENT_APP_PRIVATE_KEY }}
      SQUADHQ_HANDOFF_KEY: ${{ secrets.SQUADHQ_HANDOFF_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY_1: ${{ secrets.ANTHROPIC_API_KEY_1 }}
      ANTHROPIC_API_KEY_2: ${{ secrets.ANTHROPIC_API_KEY_2 }}
      ANTHROPIC_API_KEY_3: ${{ secrets.ANTHROPIC_API_KEY_3 }}
      ANTHROPIC_API_KEY_4: ${{ secrets.ANTHROPIC_API_KEY_4 }}
      ANTHROPIC_API_KEY_5: ${{ secrets.ANTHROPIC_API_KEY_5 }}
      CLAUDE_CODE_OAUTH_TOKEN_1: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_1 }}
      CLAUDE_CODE_OAUTH_TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
      CLAUDE_CODE_OAUTH_TOKEN_3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_3 }}
      CLAUDE_CODE_OAUTH_TOKEN_4: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_4 }}
      CLAUDE_CODE_OAUTH_TOKEN_5: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_5 }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      PAGERDUTY_ROUTING_KEY: ${{ secrets.PAGERDUTY_ROUTING_KEY }}
      SQUADHQ_WEBHOOK_URL: ${{ secrets.SQUADHQ_WEBHOOK_URL }}
      SQUADHQ_WEBHOOK_SECRET: ${{ secrets.SQUADHQ_WEBHOOK_SECRET }}
