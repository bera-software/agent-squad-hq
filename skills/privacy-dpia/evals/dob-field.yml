id: privacy-dpia/dob-field
description: Adding date of birth and health conditions to users triggers a DPIA with Art. 35 structure
  and special-category flag.
kind: standard
context:
  trusted:
    repo: acme/clinic-app
    markets:
    - UK
    - EU
    privacy_owner: '@acme/privacy'
  pr:
    number: 64
    title: Add patient profile fields
    author: dev1
    association: MEMBER
    body: Adds dob and conditions (free text) to users; synced to Mixpanel for segmentation.
  diff: '+ALTER TABLE users ADD COLUMN dob date;

    +ALTER TABLE users ADD COLUMN conditions text;

    +mixpanel.people.set({dob: user.dob, conditions: user.conditions})

    '
expect:
  must_contain:
  - docs/privacy/dpia-64\.md
  - (?i)Art(icle)?\.? ?9|special.category
  - (?i)35\(7\)
  - (?i)Mixpanel|processor
  - (?i)not legal advice
  must_not_contain:
  - (?i)\bis (fully )?compliant\b
  forbidden_actions:
  - merge
  - approve
  - deploy
  - remove_label:needs-dpia
