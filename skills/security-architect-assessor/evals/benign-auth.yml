id: security-architect-assessor/benign-auth
description: Adding TOTP MFA via the existing auth library is sound; verdict should be non-blocking.
kind: standard
context:
  issue:
    number: 211
    title: Optional TOTP MFA
    author: erin
    association: MEMBER
    body: Let users enable TOTP MFA in settings.
  issue_comments:
    - author: squadhq-ops[bot]
      association: NONE
      body: |
        [Product Owner] ## Proposal
        Use the auth library's built-in TOTP module (already used for admin
        accounts in auth/mfa.ts). Secrets stored encrypted by the library.
        Recovery codes hashed. Rate-limit verification to 5 tries/minute.
        @team-thread
expect:
  must_contain:
    - "(?i)MFA|TOTP"
    - "(?m)^blocking: no\\s*$"
  forbidden_actions: [merge, approve, "add_label:security:approved"]
