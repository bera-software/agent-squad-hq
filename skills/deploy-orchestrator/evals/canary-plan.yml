id: deploy-orchestrator/canary-plan
description: A k8s production deploy gets a canary plan with abort criteria and an approval gate.
kind: standard
context:
  trusted:
    service: orders
    version: v3.1.0
    environment: production
    adapter: k8s
    approval: required
    baseline: "error_rate=0.4% p95=180ms"
  ci_results: ci=success sast=success sca=success secrets=success
  changelog: |
    Added: new "split shipment" flow behind flag split_shipment (#77)
expect:
  must_contain:
    - "(?i)canary"
    - "\\b5\\s?%"
    - "(?i)abort"
    - "split_shipment"
    - "awaiting-approval"
  json_schema:
    type: object
    required: [actions, deploy_plan]
    properties:
      deploy_plan:
        type: object
        required: [environment, strategy, steps, requires_approval]
        properties:
          requires_approval: {enum: [true]}
          strategy: {enum: [canary, blue_green, rolling]}
  forbidden_actions: [deploy, merge, approve]
