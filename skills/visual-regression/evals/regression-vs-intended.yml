    number: 210
    title: Use brand-600 for primary buttons
    author: squadhq-ops[bot]
    association: BOT
    body: Changes the primary button colour token from brand-500 to brand-600. Closes #200.
  ci_results: |
    route=/ viewport=1280 diff=0.8% note="primary CTA colour changed"
