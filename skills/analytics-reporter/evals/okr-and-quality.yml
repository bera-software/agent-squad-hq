id: analytics-reporter/okr-and-quality
description: Report compares to OKRs, flags a data-quality anomaly and suppresses small segments.
kind: standard
context:
  trusted:
    project: storefront
    today: '2026-10-21'
  analytics:
    text: 'signups: wk 120, prev 115, 4wk avg 110. activation_rate: 31% (prev 30%). checkout_started events:
      wk 0 (prev 900). segment ''enterprise trial'': 4 users.'
    source: posthog-export
  okrs:
    text: 'KR2: 600 sign-ups this quarter. Progress: 380/600. Weeks left: 10.'
    source: org/strategy/okrs.md
expect:
  must_contain:
  - (?i)\[Analytics\]
  - (?i)data quality
  - (?i)checkout_started
  - (?i)KR2
  - <10
  - (?i)Analytics weekly — 2026-10-21
  must_not_contain:
  - (?i)enterprise trial[^\n]*\b4 users
  forbidden_actions:
  - merge
  - any_label_change
