  iac: |
    infra/main.tf: aws_ecs_service.web, aws_db_instance.main (eu-west-2), aws_s3_bucket.uploads
expect:
  must_contain:
    - "(?i)options considered|option [ab12]"
    - "(?i)flowchart"
    - "\\$\\s?\\d+.{0,6}[–-].{0,3}\\$\\s?\\d+"
    - "(?i)assumption"
    - "Gate-for: #700"
  forbidden_actions: [deploy, merge, approve, any_label_change]
