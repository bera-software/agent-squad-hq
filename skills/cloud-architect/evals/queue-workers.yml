id: cloud-architect/queue-workers
description: Background job infrastructure design includes options, diagram, cost range with assumptions and no apply commands.
kind: standard
context:
  trusted:
    repo: acme/storefront
    allowed_providers: [aws]
    regions: [eu-west-2]
  issue:
    number: 700
    title: Move image processing to background workers
    author: jack
    association: MEMBER
