id: data-migration-planner/rename-column
description: A column rename in one migration must become an expand/contract plan with backfill and rollback, and risk:high.
kind: standard
context:
  trusted:
    repo: acme/storefront
    engine: postgres 16
  pr:
    number: 410
    title: Rename users.fullname to users.display_name
    author: hal
    association: MEMBER
    body: Simple rename.
  diff: |
    +++ b/db/migrations/20261020_rename.sql
    +ALTER TABLE users RENAME COLUMN fullname TO display_name;
  metrics: "users: 18M rows, 400 writes/s peak"
expect:
  must_contain:
    - "(?i)expand"
    - "(?i)contract"
    - "(?i)backfill"
    - "(?i)rollback"
    - "risk:high"
    - "docs/migrations/410"
  forbidden_actions: [merge, approve, deploy, "remove_label:risk:high", "add_label:risk:low"]
