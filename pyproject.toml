[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-squad-hq"
dynamic = ["version"]
description = "An AI software team that runs in your GitHub org: shape, design, build, review, secure and ship."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Bera Software & Consultancy Ltd" }]
keywords = ["ai-agents", "github-actions", "devops", "ssdlc", "llm", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "PyYAML>=6.0.1,<7",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29,<1",
]
postgres = [
  "psycopg[binary]>=3.1,<4",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML",
  "httpx>=0.27",
]

[project.scripts]
squadhq = "squadhq.cli:main"

[project.urls]
Homepage = "https://github.com/berasoftware/agent-squad-hq"
Documentation = "https://github.com/berasoftware/agent-squad-hq/tree/main/docs"
Issues = "https://github.com/berasoftware/agent-squad-hq/issues"

[tool.hatch.version]
path = "src/squadhq/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/squadhq"]

# The hub template ships inside the wheel so `squadhq init --hub-dir DIR` can
# scaffold a new hub without a source checkout (squadhq.config.scaffold; keep
# in sync with its TEMPLATE_ITEMS).
[tool.hatch.build.targets.wheel.force-include]
"prompts" = "squadhq/_hub/prompts"
"agents" = "squadhq/_hub/agents"
"packs" = "squadhq/_hub/packs"
"skills" = "squadhq/_hub/skills"
"org" = "squadhq/_hub/org"
"onboarding" = "squadhq/_hub/onboarding"
"templates" = "squadhq/_hub/templates"
"config/flows.yml" = "squadhq/_hub/config/flows.yml"
"schema" = "squadhq/_hub/schema"
"evals/golden" = "squadhq/_hub/evals/golden"
"evals/thresholds.yml" = "squadhq/_hub/evals/thresholds.yml"
".github/workflows" = "squadhq/_hub/.github/workflows"
".github/actions" = "squadhq/_hub/.github/actions"
".github/dependabot.yml" = "squadhq/_hub/.github/dependabot.yml"
"squadhq.example.yml" = "squadhq/_hub/squadhq.example.yml"
"deploy/github-app" = "squadhq/_hub/deploy/github-app"
"docs/FLOW-DIAGRAM.md" = "squadhq/_hub/docs/FLOW-DIAGRAM.md"
# A scaffolded hub installs itself in its workflows (setup-hub): it needs the
# build file and the hashed lock; the package source comes from the installed
# package directory (squadhq.config.scaffold.package_source).
"pyproject.toml" = "squadhq/_hub/pyproject.toml"
"requirements/actions.lock" = "squadhq/_hub/requirements/actions.lock"
"LICENSE" = "squadhq/_hub/LICENSE"
"NOTICE" = "squadhq/_hub/NOTICE"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["squadhq"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "UP", "I", "BLE"]
ignore = [
  "E501",   # long lines: legacy modules, tightened gradually
  "E741",   # `l` loop vars in legacy modules
  "S603", "S607",  # subprocess with argument lists to gh/git is the design
  "S101",   # asserts in tests
  "BLE001", # deliberate fail-open handlers are documented inline
  "UP",     # modernisation sweeps happen per module
  "I",      # import order fixed per module
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src/squadhq"]
ignore_missing_imports = true
warn_unused_ignores = true
# Strict for new subpackages; legacy modules are typed incrementally.
[[tool.mypy.overrides]]
module = ["squadhq.providers.*", "squadhq.trackers.*", "squadhq.notify.*", "squadhq.config.*", "squadhq.policy.*", "squadhq.server.*", "squadhq.executors.*", "squadhq.codehost.*", "squadhq.skills.*", "squadhq.audit.*", "squadhq.store.*", "squadhq.scheduler.*", "squadhq.quality.*"]
disallow_untyped_defs = true
