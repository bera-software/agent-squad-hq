      color: "BFD4F2"
      description: "Unreviewed debt-scanner finding, awaiting CoS's DEBT INTAKE accept/decline."
      source: "src/squadhq/onboard.py:63; router.yml:1287,1290,1292; tech-debt-weekly.yml:105"
    "awaiting-approval":
