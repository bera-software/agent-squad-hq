##############################################################################
# config/flows.yml — single source of truth for label registry, flow state
# machines, role authority, idempotency rules, and numeric limits.
#
# Prompts reference this file for MECHANICAL rules (labels, transitions,
# limits). JUDGMENT (product thinking, quality bars, writing style) stays
# in the prose prompts — this file never tells an agent HOW to think, only
# what labels/limits/authority apply.
#
# Edit this file FIRST when changing any label/transition/role/limit, then
# update the affected prompt(s) to match. docs/FLOW-DIAGRAM.md is
# auto-generated from this file (src/squadhq/flow_diagram.py) — never hand-edit
# the diagram. src/squadhq/flow_reader.py validate checks this file's internal
# consistency (labels referenced in transitions exist, roles referenced
# exist, no orphan states).
#
# Entries carry a `source:` pointer to the code or prompt that enforces
# them. Where two sources disagreed, the more restrictive rule was kept and
# the resolution is noted inline as "# CONFLICT:".
##############################################################################

meta:
  version: 1

##############################################################################
# LABELS — full registry. Colors: NONE of these labels have ever had a
# color anywhere in this codebase — src/squadhq/onboard.py:141 calls
# `gh label create <l> -R <repo> --force` with no `--color` flag, so every
# label has always gotten GitHub's random default color. The task premise
# of "source colors from onboard.py" does not hold; there was nothing to
# source. The colors below are a NEW addition (not historical), assigned
# here for the first time as a legible standard palette. onboard.py (step 4
# of this change) starts applying them going forward.
##############################################################################
# LABEL OWNERSHIP. Every real label carries
# `applied_by`: the roles allowed to ADD it. Enforced in code by
# src/squadhq/label_guard.py — directly in agent_runner.py's executor (hub loops)
# and as a `gh` wrapper on PATH in every claude-code-action job (router.yml
# and the hub's agent workflows), which refuses the add before it happens.
# `any` = every role; `[]` = no agent at all (router code / the approver only).
# Removing a label is not guarded. The approver, router.yml's own shell steps
# and src/squadhq/stuck_sweeper.py are code, not agents, and are never guarded.
label_role_groups:
  reporter: [growth, seo, legal, finance, ecosystem-watch, okr-tracker,
             lessons-harvester, daily-brief, weekly-rollup, architect-quarterly]

labels:
  dept:
    "dept:backend":
      applied_by: [any]
      color: "1D76DB"
      description: "Backend engineering ownership."
      source: "src/squadhq/onboard.py:61"
    "dept:frontend":
      applied_by: [any]
      color: "1D76DB"
      description: "Frontend engineering ownership."
      source: "src/squadhq/onboard.py:61"
    "dept:growth":
      applied_by: [any]
      color: "1D76DB"
      description: >
        Growth ownership. Also used by SEO's own weekly report and
        self-actuated tickets — there is no separate dept:seo label.
        # CONFLICT: prompts/... SEO's report/ticket labeling uses
        # dept:growth, not a dept:seo that doesn't exist anywhere in the
        # registry (agents/seo/prompt.md, extraction citation L13-14).
        # Resolution: documented as intentional (SEO folded under Growth
        # department), not invented a new label — the more conservative
        # choice vs adding an untested new label.
      source: "src/squadhq/onboard.py:61; agents/seo/prompt.md:13-14"
    "dept:legal":
      applied_by: [any]
      color: "1D76DB"
      description: "Legal ownership."
      source: "src/squadhq/onboard.py:61"
    "dept:finance":
      applied_by: [any]
      color: "1D76DB"
      description: "Finance ownership."
      source: "src/squadhq/onboard.py:61"
    "dept:engineering":
      applied_by: [any]
      color: "1D76DB"
      description: >
        Cross-cutting engineering ownership — used by Ecosystem Watch,
        Chief of Staff (cross-project escalations), Daily Brief, Rollup.
      source: >
        src/squadhq/onboard.py:61; agents/ecosystem-watch/prompt.md:54,78;
        agents/chief-of-staff/prompt.md:149; agents/daily-brief/prompt.md:43;
        agents/rollup/prompt.md:44

  priority:
    "P0":
      applied_by: [chief-of-staff]
      color: "B60205"
      description: "Drop everything — security/CVE, production-breaking. Only a approver call, except CoS auto-promotes severity:high debt to P0."
      source: "src/squadhq/onboard.py:62; agents/chief-of-staff/prompt.md:91"
    "P1":
      applied_by: [chief-of-staff, product-owner, support-triage]
      color: "D93F0B"
      description: "High priority, next up."
      source: "src/squadhq/onboard.py:62"
    "P2":
      applied_by: [chief-of-staff, product-owner, support-triage]
      color: "FBCA04"
      description: "Normal priority."
      source: "src/squadhq/onboard.py:62"
    "P3":
      applied_by: [chief-of-staff, product-owner, support-triage]
      color: "FEF2C0"
      description: "Backlog — parked, not being worked. Applied alongside verdict:backlog / verdict:decline."
      source: "src/squadhq/onboard.py:62; router.yml:1420"

  dispatch:
    "agent:implement":
      # No chief-of-staff: dispatch is deterministic (stuck
      # sweeper plan_dispatch); a CoS add would start a second agent run.
      applied_by: [product-owner, stuck-sweeper]
      color: "0E8A16"
      description: "Ready for the Engineer to implement. Triggers router.yml's implement job."
      source: "src/squadhq/onboard.py:62; router.yml:145,175,940,1983,1986,2012"
    "needs-design":
      applied_by: [chief-of-staff, product-owner, engineer, stuck-sweeper]
      color: "5319E7"
      description: "Big/architectural — routed to the Architect for a design PR before implementation. Triggers router.yml's design job."
      source: "src/squadhq/onboard.py:62; router.yml:149,1112,1689"
    "agent:shape":
      applied_by: [stuck-sweeper]
      color: "C5DEF5"
      description: >
        Re-run the Product Owner's CLASSIFY on an issue whose first intake
        never landed. Triggers router.yml's po-shape job (labeled path); the
        job removes it again after the run. Applied by hand, or by
        src/squadhq/stuck_sweeper.py for an issue still unshaped past
        flood-guards.stuck_sweeper.thresholds_minutes.unshaped.
      source: "router.yml po-shape job (labeled path); src/squadhq/stuck_sweeper.py"
    "agent:continue":
      applied_by: [stuck-sweeper]
      color: "C5DEF5"
      description: >
        Re-run the Product Owner's continuation (po-continue) for a approver
        reply on a proposal:pending / verdict:backlog / verdict:decline issue
        that never got an answer — the original run was skipped by the
        capacity breaker or failed. The job removes it after the run.
      source: "router.yml po-continue job (labeled path); src/squadhq/stuck_sweeper.py"

  status:
    "needs-human":
      applied_by: [any]
      color: "D93F0B"
      description: "Blocked on a approver decision — ambiguity, round-cap hit, push failure, missing impact justification."
      source: >
        src/squadhq/onboard.py:62; router.yml:681,831,866,2177,2193,2204,2450,
        2470,2670,2692,2693
    "status:in-progress":
      applied_by: [engineer, architect, data-engineer, database-migration-engineer, frontend-engineer, iac-devops-engineer, integration-engineer, ml-engineer]
      color: "FBCA04"
      description: "An agent is actively working the ticket/PR right now."
      source: "src/squadhq/onboard.py:64; router.yml:2010"
    "status:in-review":
      applied_by: [engineer, architect, data-engineer, database-migration-engineer, frontend-engineer, iac-devops-engineer, integration-engineer, ml-engineer]
      color: "FBCA04"
      description: >
        Something of this ticket awaits review: an open implementation PR, an
        open design PR, or a REPORT result the Engineer delivered as a comment
        ("Delivered — moved to review", approver closes it). True ONLY while one
        of those holds — src/squadhq/stuck_sweeper.py's reconciler removes it
        otherwise (e.g. the design PR merged), so gate-cleared tickets never freeze in it.
      source: "src/squadhq/onboard.py:64; router.yml:2011,2015"
    "ready-to-merge":
      # Applied only by deterministic code holding the ops identity: the
      # review-post job (from the reviewer's verdict, as data) and the stuck
      # sweeper. No agent role owns it; router self-merge requires the ops
      # sender and merge_policy re-checks who added it.
      applied_by: [stuck-sweeper]
      color: "0E8A16"
      description: >
        Reviewer approved. Applying this label is what fires router.yml's
        self-merge job. That job merges when EITHER config/projects.json
        merge_mode is "auto" (blanket, still off everywhere) OR the PR
        matches merge_policy.auto_merge below (risk-based, on). Otherwise
        the approver merges. The Reviewer MUST remove this label on any
        re-review that changes the verdict, and on a re-review triggered by
        a base-branch change (a stacked PR's base merging) — see
        merge_policy.safety_rails.
      source: "src/squadhq/onboard.py:65; router.yml:196,2364,2371; prompts/review.md"
    "fork:approved":
      # HUMAN ONLY. A maintainer applies it after reviewing a fork PR; ci-gate
      # accepts it only from a non-bot user, added after the current head.
      applied_by: []
      color: "5319E7"
      description: >
        A maintainer reviewed this fork PR. Until it is present ci-gate fails
        with "human review required": a fork controls its own copy of the stub
        workflow, so nothing it reports is trusted. Forks are protected
        primarily by the required human approval and the "Require approval
        for all outside collaborators" Actions setting.
      source: "router.yml ci-gate"
    "needs-approver-merge":
      applied_by: []
      color: "E99695"
      description: >
        Reviewer approved, but router.yml's self-merge job decided the PR does
        NOT qualify for automatic merge — it did not match
        merge_policy.auto_merge, or the merge request itself was rejected.
        Applied by that job together with a "[Self-Merge]" PR comment naming
        the reason, so the decision is visible on the PR and not only in a run
        summary. Also the dedupe key for that comment: present means the
        approver has already been told, so the job stays quiet on the Reviewer's
        next re-application of "ready-to-merge".
        REMOVED by the same job when a later round DOES qualify (a stale one
        would make the Daily Brief list an auto-merging PR as awaiting a
        click), and by the Reviewer on REQUEST CHANGES.
        Read by agents/daily-brief/prompt.md §1 Decisions.
      source: "router.yml self-merge job; agents/daily-brief/prompt.md"
    "review:changes-requested":
      # From the reviewer's verdict via review-post (ops identity), or the sweeper.
      applied_by: [stuck-sweeper]
      color: "D93F0B"
      description: "Reviewer requested changes. Triggers router.yml's review-fix job (capped at 2 automated rounds)."
      source: "src/squadhq/onboard.py:65; router.yml:140,679,689,837,854"
    "escalation":
      applied_by: [any]
      color: "E99695"
      description: "Needs approver attention outside the normal ticket flow — workflow failure, budget cap, stall, cross-project item, capacity trip."
      source: "src/squadhq/onboard.py:63; router.yml:821,2034,2801"

  lifecycle:
    "debt":
      applied_by: [chief-of-staff, stuck-sweeper, dependency-steward]
      color: "006B75"
      description: "Accepted tech-debt work, dispatched like a normal ticket."
      source: "src/squadhq/onboard.py:63; router.yml:593,1284,1293; tech-debt-weekly.yml:64,81,98,99,105,106,187,196,236"
    "debt-proposal":
