##############################################################################
# IDEMPOTENCY — standing rules referenced by name from roles.*.idempotency.
##############################################################################
idempotency:
  label-before-add:
    rule: >
      Before add_labels/remove_labels, check whether the target labels are
      already present/absent. agent_runner.py's executor enforces this in
      code as a backstop (skips as a no-op); CoS's own prompt additionally
      instructs checking BEFORE acting rather than relying on the backstop.
    enforced_by: "code + prompt"
    source: "src/squadhq/agent_runner.py:788-797 (add), 826-835 (remove); agents/chief-of-staff/prompt.md IDEMPOTENCY block"

  duplicate-comment-24h:
    rule: >
      Escalation-issue dedup: find_recent_open_issue() matches on EXACT
      title string AND createdAt within the last 24h; if found, comments
      "Recurred — see below" on the existing issue instead of creating a
      new one. NOTE: this is narrower than "don't repeat any comment in
      24h" — it is specifically an escalation-issue title-and-age match, not
      a general duplicate-comment detector. CoS's own prompt separately
      instructs a broader habit (check for an identical comment posted by
      itself in the last 24h) at the prompt level only, not code-enforced.
    enforced_by: "code (escalation issues only) + prompt (broader, CoS only)"
    source: "src/squadhq/agent_runner.py:967-995 find_recent_open_issue(); agents/chief-of-staff/prompt.md IDEMPOTENCY block"

  gate-clear-guard:
    rule: >
      Before clearing a design gate (removing needs-design, adding
      agent:implement), check #N is open AND does not already carry
      agent:implement. A merged design PR stays in recent_merged across
      multiple CoS cycles — without this check the gate would be
      "re-cleared" (redundant label churn) every cycle.
    enforced_by: "prompt only"
    source: "agents/chief-of-staff/prompt.md duty 6 GATE-CLEAR IDEMPOTENCY"

  merge-state-only-closures:
    rule: >
      Never assert or act on a PR being merged unless it appears in the
      recent_merged list of the current run's input data. Never close an
      issue because its PR "looks done." Labels never imply state
      (ready-to-merge means awaiting approval, not merged;
      status:in-review means awaiting review, not done).
    enforced_by: "prompt only"
    source: "agents/chief-of-staff/prompt.md duty 5 STATE GROUNDING"

  dedup-before-create:
    rule: >
      Before creating a new issue for a finding, search existing open
      issues for one covering the same underlying thing. If found: add
      evidence via a comment on the existing issue (and bump its severity
      label if this pass's severity is higher) instead of creating a
      duplicate. Originally debt-scanner-only; applied to Ecosystem Watch's
      self-actuation too as of this change (see roles.ecosystem-watch
      CONFLICT note) — a persistent unresolved finding should accumulate
      evidence on one ticket across weekly report cycles, not spawn a new
      ticket every cycle.
    enforced_by: "prompt only"
    source: "prompts/debt-scan.md; agents/ecosystem-watch/prompt.md"

  duplicate-pr-guard:
    rule: "If an open PR already exists for a ticket, do not re-implement — only fix issue labels and comment."
    enforced_by: "prompt only"
    source: "prompts/implement.md L118-124"

  gate-check-before-implement:
    rule: "If the ticket carries needs-design, or an unmerged Design: PR exists for it, do not implement — remove agent:implement if present and comment blocked."
    enforced_by: "prompt only"
    source: "prompts/implement.md L113-116"

##############################################################################
# MERGE POLICY — WHO merges an approved PR.
#
# THREE tiers, evaluated by two different jobs:
#
#   trivial_merge  router.yml's `trivial-merge` job, on pull_request.
#                  No review happens at all — the `review` job is gated off by
#                  detect-changes' trivial_only output. Applies
#                  "ready-to-merge" itself and enables auto-merge.
#
#   auto_merge     router.yml's `self-merge` job, on the Reviewer's
#                  "ready-to-merge" label. The review DID happen; this asks
#                  whether the approver's click can be skipped.
#                  OFF BY DEFAULT (OSS ships merge mode "approvers").
#
#   approver_merge everything else. The default: a human in the approver set
#                  merges.
#
# The two automated tiers are independent, not a fallthrough: a trivial PR
# never reaches auto_merge, and a reviewed PR never reaches trivial_merge.
# Both are implemented by src/squadhq/merge_policy.py — ONE evaluator, called
# with a tier name. Adding a condition to a tier here without adding an
# evaluator there disables that tier rather than widening it.
#
# requires_all is AND — every condition must hold. Any condition that cannot
# be EVALUATED (missing risk label, unreadable file list, failed author
# lookup) counts as NOT MET: the job fails closed to approver merge.
#
# OPTING IN to auto_merge (risk-based merge without a human click). Do this
# only when ALL of the following hold for the project:
#   1. SAST, SCA and secret scanning run as REQUIRED checks in the project's
#      ruleset (the `gate:sast`, `gate:sca`, `gate:secrets` labels below record
#      their outcome; ci-gate must fail when any of them fails);
#   2. the deterministic risk floor is in force — the `final_risk: low`
#      condition below. final risk = max(Reviewer's risk:* label, path floor
#      from squadhq.policy.risk + the packs' risk_paths). Anything touching
#      auth/crypto/payments, migrations, dependency manifests or lockfiles,
#      workflows, IaC or secrets/config is never low, whatever a model says;
#   3. an independent security reviewer (roles.security-reviewer) is enabled,
#      and you are comfortable that `security:approved` is applied by it.
# Then set auto_merge.enabled: true. Leaving any condition out of
# requires_all widens what merges unattended — do not.
##############################################################################
merge_policy:
  auto_merge:
    enabled: false
    requires_all:
      - review_verdict: approve
        # The "ready-to-merge" label that fires the job is applied by the
        # Reviewer's APPROVE verdict; re-read at evaluation time.
      - risk_tag: low
        # The PR carries exactly one risk:* label, and it is risk:low.
      - final_risk: low
        # max(risk label, deterministic path floor) must be low. Evaluated by
        # src/squadhq/merge_policy.py via squadhq.policy.risk over the PR's
        # changed files plus merge_policy.risk_paths and the RISK_EXTRA_GLOBS
        # env var (pack risk_paths). Unreadable file list -> high.
      - ci_checks: passing
        # Refuses a PR with an ALREADY-FAILED check. A still-running check is
        # not a refusal: the merge uses `gh pr merge --squash --auto`, so
        # GitHub holds the PR until every REQUIRED check passes.
      - pr_author_type: bot
        # Human-authored PRs always wait for a human merge.
    label: ready-to-merge

  # Extra globs (beyond squadhq.policy.risk's core list) that force a PR's
  # risk to high for every project. Packs add their own risk_paths.
  risk_paths: []

  # ---------------------------------------------------------------------
  # TRIVIAL MERGE — no review at all.
  #
  # "Is there anything for a reviewer to judge?" For a PR that contains ONLY
  # regenerated, deterministic output there is not: regenerate it and you get
  # the same bytes. STRICT BY CONSTRUCTION: one non-matching file makes
  # trivial_only false and the full review runs.
  #
  # Lockfiles and dependency manifests are deliberately NOT trivial: a
  # lockfile is an INPUT to the build (resolved URLs and integrity hashes) and
  # a lockfile-only diff can repoint a dependency at a different tarball. Those
  # PRs take the normal review path, where SCA runs and the risk floor is high.
  # ---------------------------------------------------------------------
  trivial_merge:
    enabled: true
    description: "Generated/deterministic files only, on our bot's own regeneration branch — skip review"
    requires_all:
      - ci_checks: passing
      - pr_author_login: bot
        # Exactly this hub's bot login (settings.bot_logins()), not any bot:
        # another installed app's PR is somebody else's code. A human-authored
        # PR never takes this path either — a hand-edited generated file is
        # exactly what a reviewer should see.
      - trivial_lane: trivial_lanes
        # The head branch selects ONE lane and every changed file must match
        # that lane's paths: graph-refresh-* may touch only the three tracked
        # graph files, flow-diagram-* only docs/FLOW-DIAGRAM.md.
      - all_files_match: trivial_paths
        # Belt and braces: the union list router.yml mirrors.
    action: "add ready-to-merge label directly, skip review"

  trivial_lanes:
    - head_branch: "graph-refresh-*"
      paths:
        - "graphify-out/graph.json"
        - "graphify-out/GRAPH_REPORT.md"
        - "graphify-out/manifest.json"
    - head_branch: "flow-diagram-*"
      paths:
        - "docs/FLOW-DIAGRAM.md"

  # The union of trivial_lanes' paths — MIRRORED by router.yml's
  # detect-changes `trivial:` paths-filter (paths-filter patterns must be
  # literals in the workflow file). `python -m squadhq.flow_reader validate`
  # reports drift; `validate --strict` fails on it; it also fails when this
  # list is not exactly the union of trivial_lanes.
  trivial_paths:
    - "graphify-out/graph.json"       # regenerated by the graph-refresh job
    - "graphify-out/GRAPH_REPORT.md"
    - "graphify-out/manifest.json"
    - "docs/FLOW-DIAGRAM.md"          # regenerated by `python -m squadhq.flow_diagram` from this file

  approver_merge:
    description: "Everything not matching auto_merge or trivial_merge — the default."
  safety_rails:
    verdict_change_removes_label:
      rule: >
        The Reviewer MUST remove "ready-to-merge" on any re-review whose
        verdict changes. Already enforced in prompts/review.md's REQUEST
        CHANGES branch (--add-label review:changes-requested --remove-label
        ready-to-merge).
      enforced_by: "prompt only (prompts/review.md)"
    retarget_removes_label:
      rule: >
        When a stacked PR is retargeted because its base PR merged, GitHub
        does NOT remove "ready-to-merge" natively — verified, it only changes
        the base ref and emits a synchronize event. So prompts/review.md
        instructs: on a re-review following a synchronize event caused by a
        base-branch change, re-evaluate the verdict FROM SCRATCH and remove
        "ready-to-merge" if present BEFORE posting the new verdict. Without
        this, an approval earned against branch A survives onto a diff now
        measured against main.
      enforced_by: "prompt only (prompts/review.md)"
    trivial_is_strict:
      rule: >
        detect-changes' trivial_only output is true ONLY when every changed
        file matches merge_policy.trivial_paths. ONE non-matching file makes it
        false, the review job runs in full, and the PR takes the normal
        auto_merge-or-approver path. There is no partial credit and no
        "mostly trivial" — this is the defense-in-depth answer to "what if a
        trivial PR somehow includes a real code change".
      enforced_by: "code (router.yml detect-changes `trivial:` filter + count comparison; src/squadhq/merge_policy.py all_files_match re-checks it independently before merging)"
    ledger_field:
      rule: >
        Every self-merge job run records a cost-ledger line carrying
        "auto_merged": true (policy matched, merged without a approver click)
        or false (policy did not match, the approver merges). The weekly
        rollup reports "N PRs auto-merged this week, M awaited approver" from
        this field. The trivial-merge job records the same field plus
        "review_skipped": true, so finance can also report how many reviews
        the trivial tier saved. Ledger schema v7 — see src/squadhq/cost_ledger.py.
      enforced_by: "code (src/squadhq/cost_ledger.py AUTO_MERGED / REVIEW_SKIPPED env vars)"

##############################################################################
# FLOOD-GUARDS — every numeric cap/limit in one place. Roles reference
# these by name where the same number is shared across multiple roles
# (e.g. subagent_cap_default) rather than restating it per-role.
##############################################################################
flood-guards:
  subagent_cap_default:
    value: 4
    unit: "subagents per run, FOREGROUND ONLY"
    applies_to: [chief-of-staff-adjacent-claude-code-action-jobs, product-owner, architect, engineer-implement, reviewer, debt-scanner, architect-quarterly]
    note: "Identical wording copy-pasted into 7 separate prompt files — the single most duplicated mechanical rule in the whole prompt set. This is the canonical value; prompts reference it by name instead of restating the number."
    source: "prompts/debt-scan.md, prompts/design.md, prompts/implement.md, prompts/quarterly-review.md, prompts/product-owner.md, prompts/review.md (all identical)"

  self_actuation_ticket_cap_per_run:
    value: 3
    unit: "tickets per report run"
    applies_to: [growth, seo, legal, finance, ecosystem-watch]
    note: "Overflow noted in the report for next cycle, never silently dropped."
    source: "agents/growth/prompt.md, agents/seo/prompt.md, agents/legal/prompt.md, agents/finance/prompt.md, agents/ecosystem-watch/prompt.md (all identical wording)"

  growth_draft_cap_per_run:
    value: 3
    unit: "content drafts per run"
    condition: "kill score < 7"
    source: "agents/growth/prompt.md L11,16"

  debt_scanner_findings_cap_per_run:
    value: 5
    unit: "new findings per repo per run"
    enforced_in_code: true
    source: "prompts/debt-scan.md"

  cos_max_actions_per_run:
    value: 20
    unit: "actions per CoS run"
    enforced_in_code: true
    cadence_reviewed: "2026-08-27"
    cadence_note: "Unchanged by the */45 -> */30 move: same 34 runs/day, so the daily action ceiling is unmoved."
    source: "src/squadhq/agent_runner.py:626 execute() batch=actions[:20]; agents/chief-of-staff/prompt.md L163"

  wip_limit_open_prs_per_project:
    value: 5
    unit: "open PRs, per project repo"
    raised_from: 3
    raised_on: "2026-08-27"
    note: >
      Raised from 3 to 5 with stacked-PR support and risk-based auto-merge —
      low-risk PRs clear faster, freeing slots. Each ticket in a stack counts
      as its own slot: a stack of 3 is 3 WIP, not 1. Duplicated independently
      in agents/chief-of-staff/prompt.md and prompts/product-owner.md before
      the flows.yml consolidation — now single-sourced here and mirrored into
      roles.chief-of-staff / roles.product-owner (the only two places an
      agent actually reads it from).
    watch: >
      router.yml's update-prs job re-runs CI + re-review on every open PR
      targeting a pushed base branch. Its own header comment says "fine at
      WIP<=3; revisit (e.g. batch/debounce) if WIP grows" — at 5 this is now
      worth watching in the Finance report before raising further.
    source: "agents/chief-of-staff/prompt.md duty 2; prompts/product-owner.md"

  cos_report_originated_flood_pacing:
    value: "if >5 report-originated tickets arrive in one day, dispatch at most 2/cycle"
    source: "agents/chief-of-staff/prompt.md"

  cos_resurface_max_per_day:
    value: 1
    cadence_reviewed: "2026-08-27"
    note: >
      Unchanged by the CoS cadence move from */45 to */30. The cap is
      per-DAY, not per-cycle, so it is cadence-independent by construction —
      a more frequent loop just reaches the day's single resurrection sooner.
    source: "agents/chief-of-staff/prompt.md duty 8"

  cos_capacity_refire_max_per_cycle:
    value: 1
    cadence_reviewed: "2026-08-27"
    note: >
      Per-CYCLE, so nominally cadence-sensitive — but the run COUNT did not
      change: `*/45 6-22` fires at :00 and :45 (34 runs/day) and `*/30 6-22`
      fires at :00 and :30 (also 34 runs/day). Only the spacing became
      regular. Daily refire volume is therefore identical; left at 1.
    source: "agents/chief-of-staff/prompt.md duty 9"

  cos_hygiene_check_cap_per_run:
    value: 10
    unit: "issues checked per run"
    source: "agents/chief-of-staff/prompt.md duty 5"

  reporter_single_action_per_run:
    value: 1
    unit: "actions per run"
    applies_to: [daily-brief, weekly-rollup]
    note: "Hard contract, not a soft target — digest agents never take more than one action."
    source: "agents/daily-brief/prompt.md L3-4,19; agents/rollup/prompt.md L8-14,16-17"

  review_fix_round_cap:
    value: 2
    unit: "automated fix rounds before needs-human hand-off"
    source: "router.yml review-fix job; prompts/review.md L113-115 (round 2+ severity bar)"

  budget_guard_monthly_usd:
    value: 50
    unit: "USD, env-overridable via MONTHLY_BUDGET_USD"
    enforced_in_code: true
    note: "On hit: creates/reuses a 'BUDGET CAP HIT: $<budget> for <month>' issue, halts that single mode's run only — not a cross-mode kill switch."
    source: "src/squadhq/agent_runner.py:385-402"

  call_claude_retry:
    value: "2 retries (3 attempts total), backoff 1s/2s"
    transient_statuses: [408, 429, 500, 502, 503, 504]
    enforced_in_code: true
    source: "src/squadhq/agent_runner.py:486,505-513"

  capacity_trip_pause_minutes:
    value: 60
    enforced_in_code: true
    source: "src/squadhq/capacity_gate.py:243-244"

  capacity_write_retry:
    value: "up to 3 attempts, jitter 2-5s between"
    enforced_in_code: true
    source: "src/squadhq/capacity_gate.py:92-113"

  failure_handler_transient_retry_cap:
    value: "run_attempt < 3 retries; attempt 3+ escalates as TRANSIENT-EXHAUSTED"
    enforced_in_code: true
    source: "src/squadhq/failure_handler.py:312"

  gather_caps:
    open_issues_per_project: {value: 60, source: "src/squadhq/agent_runner.py:415"}
    open_prs_per_project: {value: 30, source: "src/squadhq/agent_runner.py:418"}
    recent_merged_prs_per_project: {value: 15, source: "src/squadhq/agent_runner.py:427"}
    hub_open_issues: {value: 100, source: "src/squadhq/agent_runner.py:438"}
    po_verdicts_search: {value: 100, source: "src/squadhq/agent_runner.py:336"}
    issue_pr_body_truncation_chars: {value: 800, source: "src/squadhq/agent_runner.py:431,435,442"}

  action_body_caps:
    create_issue_body_chars: {value: 6000, source: "src/squadhq/agent_runner.py:705"}
    comment_body_chars: {value: 6000, source: "src/squadhq/agent_runner.py:772"}
    title_chars: {value: 200, source: "src/squadhq/agent_runner.py:702"}

  board_sync_backfill_limit:
    value: 200
    unit: "issues per repo"
    source: "src/squadhq/board_sync.py:230"

  stuck_sweeper:
    thresholds_minutes:
      unshaped: 30
      team_thread: 60
      dispatched_not_started: 45
      design_not_started: 45
      review_missing: 60
      fix_round_not_started: 45
      merge_decision_missing: 30
      approver_reply_unanswered: 30
      in_progress_stalled: 180
      impact_missing: 30
      mention_unanswered: 30
    refire_attempts_max: 2
    refire_window_hours: 24
    # Deterministic dispatcher (plan_dispatch): at most this many new
    # agent:implement per repo per hourly run, inside the WIP limit.
    dispatch_max_per_run: 2
    # Idle alarm: a repo with no open PR, nothing in flight,
    # nothing dispatchable and no PR closed for this many hours gets ONE
    # "Pipeline idle" escalation in the project repo listing why each shaped
    # ticket is blocked; refreshed in place, closed once work flows. 0 = off.
    idle_alarm_hours: 24
    # Parked issues: verdict:decline / verdict:backlog with no
    # verdict:overridden and no approver comment for this many days since the
    # verdict closes as not planned (labels kept). Reopen + "do it anyway" /
    # "do-it-now" revives it. 0 = off.
    decline_close_days: 7
    backlog_close_days: 30
    actions_per_run_max: 10
    enforced_in_code: true
    note: >
      Deterministic (no LLM) sweep over every project repo. First RECONCILES
      each open ticket's labels with facts (its implementation / design PRs
      open, merged or closed; delivered reports), which clears design gates,
      moves tickets to review, closes merged work and escalates closed-unmerged
      PRs; cleans work labels off recently closed issues; then NORMALIZES
      contradictory label sets (removes the stale side; escalates parked AND
      dispatched), then re-checks the corrected state. An item waiting on
      AUTOMATION past its threshold gets the trigger event it is waiting for
      re-fired (label remove+re-add, draft toggle, or a re-posted @team-thread
      comment). After refire_attempts_max re-fires inside refire_window_hours it
      stops re-firing and adds needs-human instead, so nothing stays stuck
      silently. Escalates WITHOUT re-firing when the dispatched agent already
      ran and commented without a PR (implement_stopped / design_stopped).
      Items waiting on the APPROVER (proposal:pending without a
      pending team-thread, needs-human, status:in-review, needs-approver-merge,
      awaiting-approval) are never touched. Skips the whole run while the
      capacity breaker is open (state/capacity.json paused_until).
    triggers: >
      EVENT PATH first: router.yml's ticket-transition job runs on every merge
      to a project's default branch and moves the tickets that merge touched
      (src/squadhq/ticket_transition.py, same rule functions). This hourly sweep
      is the BACKSTOP — its cron was measured running only every 3-7 hours
      (GitHub schedules are best-effort) — plus manual workflow_dispatch.
    source: "src/squadhq/stuck_sweeper.py; .github/workflows/stuck-sweeper.yml; src/squadhq/ticket_transition.py"

  cos_comment_only_cooldown_hours:
    value: 24
    enforced_in_code: true
    note: >
      A Chief of Staff comment with no label change or close on the same item
      in the same batch is dropped if CoS already commented on that item
      within this window, so repeated "holding, not touching" narration on the
      same tickets is suppressed.
    source: "src/squadhq/agent_runner.py execute() NARRATION GUARD"

  hub_janitor:
    # Deterministic cleanup of the HUB repo's own issue list (src/squadhq/hub_janitor.py,
    # .github/workflows/hub-janitor.yml). Why: hub agents read at most
    # gather_caps.hub_open_issues (100) open hub issues, and ~95% of them are
    # dated reports — past the cap the OLDEST fall out of view silently.
    # Retention per report series, by age. Every hub series
    # keeps ONLY its newest issue open (retain_days 0): the digests read a
    # week of history from hq_recent_reports (open or closed, gathered by
    # src/squadhq/agent_runner.py), so a closed report is still read — it just no
    # longer clutters the list. Reporters read their previous report, which
    # is the newest, so still open. Cost ledgers: cost_ledger.py and
    # load_cost_ledger look the month up by title with --state all, so a past
    # month closes safely and the current month is always the newest.
    series:
      - {key: daily-brief,     title: "^(Daily Brief|brief report) — ",   retain_days: 0}
      - {key: growth-nightly,  title: "^(Growth nightly|growth report) — ", retain_days: 0}
      - {key: cos-report,      title: "^cos report — ",                    retain_days: 0}
      - {key: seo-weekly,      title: "^SEO weekly — ",                    retain_days: 0}
      - {key: legal-weekly,    title: "^(Legal weekly|legal report) — ",   retain_days: 0}
      - {key: finance-weekly,  title: "^(Finance weekly|finance report) — ", retain_days: 0}
      - {key: ecosystem-watch, title: "^Ecosystem Watch — ",               retain_days: 0}
      - {key: lessons-harvest, title: "^Lessons harvest — ",               retain_days: 0}
      - {key: weekly-rollup,   title: "^(Weekly Rollup|rollup report) — ", retain_days: 0}
      - {key: cost-ledger,     title: "^Cost ledger — ",                   retain_days: 0}
    # Issues with an identical title (e.g. the same failure escalated once per
    # run) are MERGED: the newest stays open with a comment listing every
    # duplicate and its run link, the rest close as "Duplicate of #N".
    merge_identical_titles: true
    # PROJECT REPOS: department reports moved out of the
    # hub. The same series/protect rules run over each registered project's
    # open issues carrying this label only — never anything else in a
    # project — with one flat retention. No title merging there.
    project_reports:
      label: "report"
      retain_days: 14
    # EXPIRE: point-in-time issues that are not a series,
    # closed once older than retain_days. Hub only (project_cfg drops it).
    # Run-failure escalations: a recurring failure opens a fresh one, so a
    # week-old one is history, not an open problem. Legacy hub drafts: Growth
    # files content in the project repo, where the PO validates it.
    expire:
      - {key: run-escalation,   title: "^ESCALATION\\b", retain_days: 7,
         reason: "run-failure escalation older than 7 days — a recurrence opens a new one"}
      - {key: legacy-hub-draft, title: "^Draft: ",       retain_days: 14,
         reason: "legacy hub content draft — content now flows through the project repo (channel:external)"}
      - {key: legacy-growth-nightly, title: "^Growth nightly — ", retain_days: 14,
         reason: "Growth reports live in the project repo"}
      # The newest of a series is always kept — but these series no longer
      # get new hub issues (they live in project repos), so their
      # last hub issue would stay open forever without this.
      - {key: legacy-dept-report, title: "^(SEO weekly|Legal weekly|legal report|growth report|cos report) — ",
         retain_days: 14, reason: "department reports live in the project repo"}
      - {key: cos-escalation,   title: "^\\[Chief of Staff\\] ", retain_days: 14,
         reason: "Chief of Staff escalation older than 14 days with no approver reply — CoS re-raises it if still true"}
    # Never touched, whatever the rules above say.
    protect:
      titles: ["^Claude capacity window exhausted$", "^Quarterly Architecture Review"]
      # awaiting-approval is not protected: no hub issue is created with it
      # any more (content approvals live in project repos), and it kept 30
      # stale hub drafts open forever. A draft the approver commented on is
      # still protected by human_engaged.
      labels: []
      human_authored: true        # opened by a person, not an agent
      human_engaged: true         # any OWNER/MEMBER/COLLABORATOR comment
      pinned: true
    actions_per_run_max: 80
    enforced_in_code: true
    note: >
      Cost ledgers are a series, not protected: every reader
      looks the month up by title with --state all. The capacity
      escalation (capacity_gate.py refreshes it by title; CoS duty 9 reads its
      closure as "capacity is back") and the quarterly review are approver-
      or script-owned — closing them
      would break a lookup or drop a pending decision.
    source: "src/squadhq/hub_janitor.py"

  debt_refactor_share_target:
    value: "~20%"
    unit: "share of dispatched work"
    source: "agents/chief-of-staff/prompt.md duty 3"
