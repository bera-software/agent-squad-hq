        it is in stuck_sweeper's BLOCKING and APPROVER_WAIT_LABELS.
      source: "src/squadhq/onboard.py:63; prompts/product-owner.md CONTENT TICKETS; flows.content-flow"
    "proposal:pending":
      applied_by: [product-owner]
      color: "BFDADC"
      description: "PO posted a NEEDS SHAPING ## Proposal comment; waiting on team input and/or approver reply."
      source: "src/squadhq/onboard.py:65; router.yml:163,165,1413,1415,1421,1431,1491,1493"
    "triaged:ready":
      applied_by: [product-owner, chief-of-staff]
      color: "C5DEF5"
      description: "PO classified SHAPED — concrete, single deliverable. CoS dispatches from here."
      source: "src/squadhq/onboard.py:65; agents/chief-of-staff/prompt.md (dispatch duty)"

  # CONTENT CHANNEL: Growth/SEO content drafts are
  # project work, cut as project-repo tickets the PO validates
  # (flows.content-flow). The channel decides what happens after the PO.
  channel:
    "channel:blog":
      applied_by: [growth, seo]
      color: "FBCA04"
      description: >
        Content for the project's own blog. PO validates like any ticket;
        SHAPED -> triaged:ready -> Engineer opens a PR adding the post.
        Merging the PR publishes it.
      source: "agents/growth/prompt.md CONTENT; agents/seo/prompt.md SELF-ACTUATE; prompts/product-owner.md CONTENT TICKETS"
    "channel:external":
      applied_by: [growth]
      color: "FEF2C0"
      description: >
        Content for an external venue (DEV, Indie Hackers, Reddit, a reply
        thread). Nothing to build: PO validates, then awaiting-approval for
        the approver to post by hand. NEVER agent:implement — router.yml's
        implement job and stuck_sweeper's BLOCKING both refuse it.
      source: "agents/growth/prompt.md CONTENT; prompts/product-owner.md CONTENT TICKETS; router.yml implement job; src/squadhq/stuck_sweeper.py BLOCKING"

  # DEPARTMENT REPORTS: anything about one project lives
  # in that project's repo — including the SEO/Legal/Growth reports, which
  # used to be hub issues. "report" marks them as not-work: excluded from
  # gather's open_issues (agent_runner.py gathers them as recent_reports),
  # never carries Originated-by: (so no PO intake), and retired after
  # flood-guards.hub_janitor.project_reports.retain_days by the janitor.
  report:
    "report":
      applied_by: [growth, seo, legal, analytics-reporter, documentation-gardener, finops]
      color: "EDEDED"
      description: >
        A department report (SEO weekly, Legal weekly, Growth nightly), not a
        work item. Closed by the janitor after 14 days (newest of each series
        kept). Filter it out of the board's work views.
      source: "agents/seo/prompt.md; agents/legal/prompt.md; agents/growth/prompt.md; src/squadhq/agent_runner.py gather; src/squadhq/hub_janitor.py"

  verdict:
    "verdict:proceed":
      applied_by: [product-owner]
      color: "BFD4F2"
      description: "PO's audit-trail stamp for a PROCEED call. Never touched by CoS."
      source: "src/squadhq/onboard.py:66"
    "verdict:backlog":
      applied_by: [product-owner]
      color: "D4C5F9"
      description: "PO's audit-trail stamp for a BACKLOG call. Applied with P3; the stuck sweeper closes it after stuck_sweeper.backlog_close_days without a approver reply."
      source: "src/squadhq/onboard.py:66; router.yml:164,165,1418,1424,1432,1492,1495"
    "verdict:decline":
      applied_by: [product-owner]
      color: "D4C5F9"
      description: "PO's audit-trail stamp for a DECLINE call. Applied with P3; the stuck sweeper closes it after stuck_sweeper.decline_close_days without a approver reply."
      source: "src/squadhq/onboard.py:66; router.yml:164,165,1418,1424,1432,1492,1495"
    "verdict:overridden":
      applied_by: [product-owner]
      color: "5319E7"
      description: "Approver overrode a verdict:backlog/verdict:decline (do-it-now / do it anyway). Dispatched same run."
      source: "src/squadhq/onboard.py:66; router.yml:1424"

  severity:
    "severity:high":
      applied_by: [debt-scanner, reporter, secrets-response]
      color: "B60205"
      description: >
        CVE/security findings (debt scanners — see note below), deadline
        <30-day Ecosystem Watch action items, HIGH-severity Legal findings,
        >80%-of-budget Finance pace warnings.
        # The debt scanner applies severity:high to every CVE/security
        # finding, whatever the stack, so CoS's debt-intake promotes it to P0.
      source: "src/squadhq/onboard.py:63; prompts/debt-scan.md"

  dynamic:
    "project:<name>":
      applied_by: [reporter]
      color: "5319E7"
      description: >
        One label per registered project (config/projects.json), created
        in the HUB repo only (never in project repos). Applied to every
        reporting agent's hub issue. NOT present in src/squadhq/onboard.py's
        static LABELS array — it's generated per-project by onboard.py's
        own project-registration step, missed by a naive "read LABELS"
        extraction. Included here so the registry is actually complete.
      source: "src/squadhq/onboard.py:142,192 (created per-project, not in LABELS)"

  # HUB-ONLY labels. Real GitHub labels, but they belong on the hub repo and
  # nowhere else — a project repo has no use for them and should not carry
  # them. Excluded from static_label_names() (src/squadhq/flow_reader.py's
  # _STATIC_LABEL_EXCLUDED_CATEGORIES) so onboard.py never creates them on a
  # project; created on the HUB by onboard.py's apply(), alongside
  # project:<name>.
  # Both are applied by
  # src/squadhq/agent_runner.py's MODE_LABEL and demanded by the two digest
  # prompts, but appeared nowhere in this registry — so nothing ever created
  # them, and they only worked because they had been made by hand in the hub.
  # On a fresh hub the create_issue call would have failed "label not found"
  # and silently retried unlabeled (agent_runner.py:721-727), leaving Growth's
  # "read strategy context from any issue labeled daily-brief" instruction
  # matching nothing, forever.
  hub_only:
    "daily-brief":
      applied_by: [daily-brief]
      color: "0052CC"
      description: >
        The Daily Brief's own report issue (one per weekday). Also read by
        agents/growth/prompt.md for strategy context.
      source: >
        src/squadhq/agent_runner.py:1094-1098 MODE_LABEL; agents/daily-brief/prompt.md:4;
        agents/growth/prompt.md:11; README.md
    "weekly-rollup":
      applied_by: [weekly-rollup]
      color: "0052CC"
      description: "The Weekly Rollup's own report issue (one per Monday)."
      source: >
        src/squadhq/agent_runner.py:1094-1098 MODE_LABEL; agents/rollup/prompt.md:24;
        README.md

  # RISK CLASSIFICATION — applied by the Reviewer on its APPROVE verdict
  # (prompts/review.md's handoff "Risk:" line), read by router.yml's
  # self-merge job to evaluate merge_policy.auto_merge (below).
  # The label is the MODEL's judgment. squadhq.policy.risk computes a
  # deterministic path floor (auth, payments, migrations, dependencies,
  # workflows, IaC, secrets) and the final risk is max(label, floor): a
  # model can raise risk, never lower it.
  risk:
    "risk:low":
      # Applied by review-post (ops identity) as max(reviewer verdict, path floor).
      applied_by: []
      color: "0E8A16"
      description: >
        Reviewer-assessed low risk. One of the conditions in
        merge_policy.auto_merge.requires_all — the others being reviewer
        APPROVE, bot-authored, no failing check, and a path-based risk floor
        of low (squadhq.policy.risk). Only consulted when
        merge_policy.auto_merge is enabled (off by default).
      source: "prompts/review.md APPROVE handoff; merge_policy.auto_merge"
    "risk:medium":
      applied_by: []
      color: "FBCA04"
      description: >
        Reviewer-assessed medium risk — also the Reviewer's deliberate
        "I am not certain" escape hatch. Always forces a approver merge.
      source: "prompts/review.md APPROVE handoff; merge_policy.auto_merge"
    "risk:high":
      # Raising risk is always safe, so specialists may still add it.
      applied_by: [data-engineer, database-migration-engineer, iac-devops-engineer, iac-scanner-triage, rollback]
      color: "D93F0B"
      description: "Reviewer-assessed high risk. Always forces a approver merge."
      source: "prompts/review.md APPROVE handoff; merge_policy.auto_merge"

  # SSDLC ARTIFACTS — threat model, security review and the deterministic
  # scan gates (SAST / SCA / secrets). A gate:* label only ever BLOCKS: the
  # triage roles may add it (raising the bar is safe), but merge decisions
  # read the scan CHECK result in ci-gate, never the absence of the label —
  # so a model removing one cannot make a failing scan pass.
  security:
    "needs-threat-model":
      applied_by: [product-owner, architect, security-reviewer]
      color: "B60205"
      description: >
        The change needs a threat model (STRIDE + OWASP LLM Top 10) before
        implementation: new trust boundary, auth/crypto/PII/payments, or a
        design whose risk is medium or above. The Threat Modeler writes
        docs/threats/<n>.md and removes the label when it lands.
      source: "docs/security/ssdlc.md (Design)"
    "security:review-required":
      applied_by: [reviewer, threat-modeler, security-reviewer, dependency-steward, iac-scanner-triage, sast-triage, secrets-response]
      color: "D93F0B"
      description: >
        An independent security review is required before merge — always the
        case when the final risk (squadhq.policy.risk) is medium or above.
        Removed only by the Security Reviewer's verdict.
      source: "docs/security/ssdlc.md (Review)"
    "security:approved":
      applied_by: [security-reviewer]
      color: "0E8A16"
      description: >
        The independent Security Reviewer (a different model or provider from
        the author) approved the change. Required for auto-merge when
        merge_policy.auto_merge is enabled.
      source: "docs/security/ssdlc.md (Review)"
    "gate:sast":
      applied_by: [sast-triage]
      color: "5319E7"
      description: "Static analysis (CodeQL/Semgrep) found blocking issues on the PR head. Raised by ci-gate or the matching triage role; ci-gate's required check, not this label, decides the merge."
      source: "docs/security/ssdlc.md (gates)"
    "gate:sca":
      applied_by: [dependency-steward]
      color: "5319E7"
      description: "Dependency scan (OSV/npm audit/pip-audit) found a blocking vulnerability or license violation. Raised by ci-gate or the matching triage role; ci-gate's required check, not this label, decides the merge."
      source: "docs/security/ssdlc.md (gates)"
    "gate:secrets":
      applied_by: [secrets-response]
      color: "5319E7"
      description: "Secret scanning (gitleaks) found a committed credential. Raised by ci-gate or the matching triage role; ci-gate's required check, not this label, decides the merge."
      source: "docs/security/ssdlc.md (gates)"

  # OPERATIONS & BUSINESS — trigger labels for incident, planning, support,
  # privacy and sales skills (skills/*/skill.yml). `[]` = applied by humans
  # or code (alert webhooks, squadhq.skills.uptime), never by an agent.
  operations:
    "incident":
      applied_by: []
      color: "B60205"
      description: "A production incident (uptime watcher, alert webhook or a human). Starts the SRE incident responder; closing it starts the postmortem writer."
      source: "skills/sre-incident-responder/skill.yml; skills/uptime-watcher/skill.yml"
    "epic":
      applied_by: [product-owner]
      color: "3E4B9E"
      description: "An approved epic the Estimator/Planner breaks into agent-sized tickets with After: #N dependencies."
      source: "skills/estimator-planner/skill.yml"
    "question":
      applied_by: []
      color: "D876E3"
      description: "A how-do-I question about Agent Squad HQ; the Onboarding Guide answers from the docs."
      source: "skills/onboarding-guide/skill.yml"
    "needs-dpia":
      applied_by: [privacy-officer]
      color: "B60205"
      description: "Processing of personal data changed; a DPIA (docs/privacy/) is required before merge."
      source: "skills/privacy-dpia/skill.yml"
    "questionnaire":
      applied_by: []
      color: "C5DEF5"
      description: "An RFP or security questionnaire for the Sales Engineer to draft answers to from the company's own docs."
      source: "skills/sales-engineer/skill.yml"
    "pentest:requested":
      applied_by: []
      color: "B60205"
      description: "An approver requested a scoped pentest pass on a preview/staging target. Only humans apply it — it authorises active testing."
      source: "skills/pentest-assistant/skill.yml"

  # Present in src/squadhq/onboard.py's LABELS (so still created on every repo,
  # unchanged behavior) but never referenced by any workflow condition or
  # dispatch rule anywhere in the codebase. Kept for backward compatibility
  # — dropping them would silently stop creating labels some external
  # process might expect. Marked deprecated so nothing new is built on them.
  deprecated:
    "refactor":
      applied_by: []
      color: "CCCCCC"
      description: "Unused. No prompt or workflow ever applies this label."
      source: "src/squadhq/onboard.py:62 (dead — confirmed via full-codebase grep)"

  # Deliberately NOT part of the GitHub label registry — never created via
  # `gh label create`, never applied via `gh issue edit --add-label`. These
  # are plain-text conventions written into report/comment PROSE that
  # downstream prompts grep for as substrings. Listed here only so nobody
  # "fixes" their absence from labels.* by mistakenly turning them into
  # real GitHub labels.
  report_tags_not_real_labels:
    "needs-lawyer":
      description: >
        Written into a Legal report's body text for items requiring lawyer
        confirmation — never a GitHub label. org/CLAUDE-org.md's
        Self-actuation policy and agents/legal/prompt.md both reference the
        literal substring "needs-lawyer", not a label.
      source: "org/CLAUDE-org.md:40; agents/legal/prompt.md:42"
    "blocking":
      description: >
        A yes/no field inside team-thread assessment comments
        ("blocking: yes"/"blocking: no"), read by the final agreement step
        to classify CONSENSUS vs DISSENT. Never a GitHub label.
      source: "router.yml team-thread job, assessment steps ~1693-1912"

##############################################################################
# FLOWS — six state machines. Each transition cites the actor (job name or
# role) and the exact trigger condition where one exists in code.
##############################################################################
flows:

  ticket-lifecycle:
    description: >
      A ticket's life from a plain issue to a merged/closed PR, covering
      both the approver-authored and self-actuated (Originated-by:) paths.
    states: [new, needs_shaping, shaped, dispatched, needs_design,
             in_progress, in_review, needs_human, closed]
    transitions:
      - from: new
        to: shaped
        trigger: "issues.opened, PO classifies SHAPED"
        actor: product-owner
        condition: "concrete, single deliverable, clear acceptance implied"
        labels_add: ["triaged:ready"]
        note: >
          The PO also stamps exactly one verdict:* label on every intake
          (see roles.product-owner) — PROCEED usually accompanies this
          transition; BACKLOG/DECLINE instead route to override-flow's
          `parked` state regardless of SHAPED/NEEDS SHAPING classification.
        source: "router.yml:1281 po-shape job; prompts/product-owner.md:50-54,138-149"
      - from: new
        to: needs_shaping
        trigger: "issues.opened, PO classifies NEEDS SHAPING"
        actor: product-owner
        condition: "open-ended / multi-part / ambiguous / strategic"
        labels_add: ["proposal:pending"]
        source: "router.yml:1281 po-shape job; prompts/product-owner.md:56-75"
      - from: new
        to: new
        trigger: "issues.labeled agent:shape (manual, or stuck-sweeper re-fire)"
        actor: "approver OR stuck-sweeper"
        condition: "issue still carries no PO outcome label past the unshaped threshold"
        labels_add: ["agent:shape"]
        note: >
          Re-entry into intake, not a new state: po-shape runs CLASSIFY again
          and then removes agent:shape. The outcome is one of the two
          transitions above.
        source: "router.yml po-shape job (labeled path); src/squadhq/stuck_sweeper.py"
      - from: needs_shaping
        to: shaped
        trigger: "team-thread CONSENSUS, or approver approval/override reply"
        actor: "team-thread (final agreement step) OR po-continue"
        labels_remove: ["proposal:pending"]
        labels_add: ["agent:implement", "needs-design"]
        note: "one of the two, per the shaped ticket plan — agent:implement for a code ticket, needs-design for size-L/architectural"
        source: "router.yml:1412 po-continue; router.yml:1560 team-thread; see also override-flow"
      - from: shaped
        to: dispatched
        trigger: "hourly deterministic dispatch: WIP slot free, ready (triaged:ready or accepted debt), impact context present, After: order met"
        actor: stuck-sweeper
        condition: "not needs-design, not P3"
        labels_add: ["agent:implement"]
        labels_remove: ["triaged:ready"]
        source: "agents/chief-of-staff/prompt.md duty 2 (L75-77)"
      - from: shaped
        to: needs_design
        trigger: "CoS triage duty, size L / architectural"
        actor: chief-of-staff
        labels_add: ["needs-design"]
        source: "agents/chief-of-staff/prompt.md duty 1 (L73-74)"
      - from: needs_design
        to: dispatched
        trigger: "design PR merged, gate cleared (see design-gate flow)"
        actor: chief-of-staff
        labels_remove: ["needs-design"]
        labels_add: ["agent:implement"]
        source: "agents/chief-of-staff/prompt.md duty 6; see flows.design-gate"
      - from: dispatched
        to: in_progress
        trigger: "issues.labeled agent:implement"
        actor: implement-job
        condition: "github.event.label.name == 'agent:implement'"
        labels_add: ["status:in-progress"]
        source: "router.yml:939-941 implement job; prompts/implement.md:49-51,142-145"
      - from: in_progress
        to: in_review
        trigger: "PR opened, Closes #N"
        actor: implement-job
        labels_add: ["status:in-review"]
        labels_remove: ["status:in-progress"]
        source: "prompts/implement.md:49-51"
      - from: [needs_design, in_review]
        to: dispatched
        trigger: "design PR (Gate-for: #N) merged — reconciled hourly by the stuck sweeper"
        actor: stuck-sweeper
        labels_remove: ["needs-design", "status:in-review", "status:in-progress"]
        labels_add: ["agent:implement"]
        note: >
          Deterministic gate-clear from PR facts, never left to a model.
          Under the WIP limit it adds agent:implement (fires implement);
          at the limit it adds triaged:ready for CoS to dispatch later.
        source: "router.yml ticket-transition (on the merge, seconds) + src/squadhq/stuck_sweeper.py reconcile_issue (hourly backstop)"
      - from: [dispatched, in_progress, in_review]
        to: needs_human
        trigger: "the ticket's PR (implementation or design) was CLOSED without merging"
        actor: stuck-sweeper
        labels_remove: ["status:in-review", "status:in-progress"]
        labels_add: ["needs-human"]
        note: "A human closed the work — re-dispatch or drop is a approver call, never guessed."
        source: "src/squadhq/stuck_sweeper.py reconcile_issue"
      - from: in_review
        to: closed
        trigger: "approver merges PR (review-loop flow's approved state) — Closes #N auto-closes"
        actor: approver
        condition: "PR must appear in agent_runner.py's recent_merged list before any agent asserts closure"
        source: "agents/chief-of-staff/prompt.md duty 5 STATE GROUNDING; router.yml:2342 auto-merge"

  review-loop:
    description: >
      A PR's life from open to merged, including the bounded 2-round
      automated fix loop.
    states: [pr_opened, classified, ci_running, review_pending,
             changes_requested, fix_round, needs_human, approved, merged]
    transitions:
      - from: pr_opened
        to: classified
        trigger: "pull_request or push"
        actor: detect-changes
        condition: "github.event_name in ('pull_request','push')"
        outputs: [backend, frontend, config, docs_only, ci_relevant, needs_review, change_scope]
        source: "router.yml:221-233 detect-changes job (dorny/paths-filter@v4)"
      - from: classified
        to: ci_running
        trigger: "pull_request, not draft"
        actor: "backend-ci or frontend-ci"
        condition: "detect-changes.outputs.backend|frontend == 'true'"
        source: "router.yml:391-396 backend-ci; router.yml:449-454 frontend-ci"
      - from: classified
        to: review_pending
        trigger: "pull_request, not draft, needs_review == 'true'"
        actor: reviewer
        condition: "a docs-only PR (needs_review=='false') skips this state entirely"
        source: "router.yml:469-483 review job"
      - from: review_pending
        to: approved
        trigger: "Reviewer APPROVE"
        actor: reviewer
        labels_add: ["ready-to-merge"]
        labels_remove: ["review:changes-requested"]
        source: "prompts/review.md:119-121"
      - from: review_pending
        to: changes_requested
        trigger: "Reviewer REQUEST CHANGES"
        actor: reviewer
        condition: "no linked issue is an automatic REQUEST CHANGES; round 2+ must cite bug/security/rule-violation only, never style"
        labels_add: ["review:changes-requested"]
        labels_remove: ["ready-to-merge"]
        source: "prompts/review.md:139-141,113-115,144"
      - from: changes_requested
        to: fix_round
        trigger: "issues.labeled review:changes-requested (round < 2)"
        actor: engineer
        condition: "gated on detect-changes needs_review output"
        source: "router.yml:675-691 review-fix job; flood-guards.review_fix_round_cap"
      - from: fix_round
        to: review_pending
        trigger: "push to PR branch re-triggers pull_request synchronize"
        actor: engineer
        source: "router.yml detect-changes re-fires on synchronize"
      - from: fix_round
        to: needs_human
        trigger: "round cap (2) reached"
        actor: review-fix-job
        labels_add: ["needs-human"]
        note: "posts a [fix-round STOP] approver-decision digest instead of a third automated attempt"
        source: "router.yml review-fix job, comment ~2192"
      - from: approved
        to: merged
        trigger: >
          pull_request_review state=='approved' by non-Bot OWNER/MEMBER (the
          auto-merge job), OR issues.labeled ready-to-merge where the PR
          satisfies merge_policy.auto_merge (the self-merge job's risk-based
          path), OR merge_mode:"auto" (the self-merge job's blanket path,
          off everywhere), OR a approver click.
        actor: "auto-merge job, self-merge job, or approver"
        condition: >
          The self-merge job evaluates merge_policy.auto_merge.requires_all
          in full; a single failing condition means it skips and the approver
          merges. See merge_policy below for the resolution order.
        source: "router.yml:2342 auto-merge; router.yml:2362 self-merge; merge_policy"
      - from: approved
        to: approved
        trigger: "deployment_status success, environment contains 'Preview'"
        actor: qa-preview
        note: "adds a Playwright check run + PR comment; does not change labels or advance state"
        source: "router.yml:2271 qa-preview"
      - from: approved
        to: approved
        trigger: "base branch pushed while this PR is merge-bound, or the PR just became merge-bound"
        actor: "update-prs (on push) / self-merge + auto-merge (on approval)"
        condition: >
          LAZY UPDATE (cost): only merge-bound PRs (ready-to-merge,
          needs-approver-merge, or auto-merge armed) are
          brought up to date with the base; other PRs are only rebased when
          they CONFLICT. The ruleset's strict up-to-date check makes the
          approval-time update mandatory, which is why self-merge and
          auto-merge carry a "Bring branch up to date" step.
        note: >
          The resulting synchronize is BASE-ONLY when the PR's three-dot diff
          is identical to the previous head's and that head passed ci-gate:
          CI re-runs against the new base, review is skipped, and ci-gate
          carries the previous verdict (detect-changes base_only output).
          Anything else — a real code change, a conflict resolution, a
          stacked-PR retarget — gets the full review as before.
        source: "router.yml update-prs, detect-changes (base_only), review, ci-gate, self-merge, auto-merge"

  team-thread:
    description: >
      Collaborative assessment round for a NEEDS SHAPING proposal —
      Architect + Engineer always, Legal/Finance/Growth conditional on the
      PO's own Team-input-scope: line. Never runs for a SHAPED ticket
      (proportional, not a blanket tax).
    states: [proposal_posted, team_input_requested, architect_assessed,
             engineer_assessed, legal_assessed, finance_assessed,
             growth_assessed, agreement_classified]
    idempotency_marker: "<!-- team-thread-complete -->"
    concurrency_group: "team-thread-${{ github.repository }}-${{ github.event.issue.number }}"
    transitions:
      - from: proposal_posted
        to: team_input_requested
        trigger: "PO posts a comment containing @team-thread with a Team-input-scope: line"
        actor: product-owner
        source: "prompts/product-owner.md:93-102"
      - from: team_input_requested
        to: architect_assessed
        trigger: "issue_comment.created, contains(comment.body,'@team-thread') && comment.user.type=='Bot'"
        actor: architect
        note: >
          A human typing the literal string is deliberately ignored — only
          a bot-authored comment (the PO's own trigger comment) fires this.
        source: "router.yml:1560,1595-1598 team-thread job"
      - from: architect_assessed
        to: engineer_assessed
        actor: engineer
        source: "router.yml:1735 team-thread job, Engineer step"
      - from: engineer_assessed
        to: legal_assessed
        condition: "Team-input-scope line contains 'legal'"
        actor: legal
        source: "router.yml:1776 team-thread job, Legal step"
      - from: engineer_assessed
        to: finance_assessed
        condition: "Team-input-scope line contains 'finance'"
        actor: finance
        source: "router.yml:1818 team-thread job, Finance step"
      - from: engineer_assessed
        to: growth_assessed
        condition: "Team-input-scope line contains 'growth'"
        actor: growth
        source: "router.yml:1861 team-thread job, Growth step"
      - from: [legal_assessed, finance_assessed, growth_assessed, engineer_assessed]
        to: agreement_classified
        trigger: "all in-scope assessments posted"
        actor: product-owner
        outcomes:
          CONSENSUS: "no assessment flagged blocking: yes -> create tickets immediately, no approver reply needed"
          DISSENT: "at least one blocking: yes -> summarize positions, ask approver to rule, wait"
          APPROVER_OVERRIDE: "approver already replied approved (any time) -> create tickets regardless, note unresolved concerns per ticket"
        source: "router.yml:1912 team-thread job, agreement step; prompts/product-owner.md:117-130"

  debt-intake:
    description: >
      Weekly tech-debt scan -> dedup-or-propose -> CoS accept/decline. Lives
      almost entirely OUTSIDE router.yml — tech-debt-weekly.yml + CoS duty 3.
      Debt-proposal issues deliberately carry no Originated-by: line so
      po-shape's widened bot-exclusion condition does not pull them into PO
      intake (see ticket-lifecycle's `new` state — this flow bypasses it).
    states: [repo_scanned, finding_dedup_checked, existing_issue_commented,
             debt_proposal_created, cos_impact_checked, accepted, declined]
    transitions:
      - from: repo_scanned
        to: finding_dedup_checked
        trigger: "cron Sun 03:00 UTC, matrix over every project repo"
        actor: debt-scanner
        source: "tech-debt-weekly.yml; prompts/debt-scan.md"
      - from: finding_dedup_checked
        to: existing_issue_commented
        condition: "finding overlaps an existing open debt/debt-proposal issue (same file/area)"
        actor: debt-scanner
        note: "gh issue comment with new evidence + gh issue edit to bump severity:high if this scan's severity is higher; NOT counted against the 5-finding cap"
        source: "prompts/debt-scan.md (tool grant widened in tech-debt-weekly.yml)"
      - from: finding_dedup_checked
        to: debt_proposal_created
        condition: "genuinely new finding, cap 5 findings/run"
        actor: debt-scanner
        labels_add: ["debt-proposal", "dept:backend", "dept:frontend", "severity:high"]
        note: "dept:backend OR dept:frontend depending on which scanner ran; severity:high only for CVE/security findings (both scanners)"
        source: "prompts/debt-scan.md"
      - from: debt_proposal_created
        to: cos_impact_checked
        actor: chief-of-staff
        condition: "Why this matters: (Business+Technical) section present in the body"
        source: "agents/chief-of-staff/prompt.md duty 3 IMPACT CHECK (L84-89)"
      - from: cos_impact_checked
        to: declined
        condition: "no Why this matters section"
        actor: chief-of-staff
        note: "comment asking for it, do NOT relabel to debt"
        source: "agents/chief-of-staff/prompt.md duty 3 IMPACT CHECK"
      - from: cos_impact_checked
        to: accepted
        actor: chief-of-staff
        labels_add: ["debt"]
        labels_remove: ["debt-proposal"]
        note: >
          Also applies a priority label (P0..P3, not fixed here — CoS's own
          triage judgment; severity:high findings get P0). Self-idempotent
          by construction — relabeling removes the issue from the
          debt-proposal match set.
        source: "agents/chief-of-staff/prompt.md duty 3 (L90-94)"

  design-gate:
    description: >
      needs-design -> Architect's design PR (Gate-for: #N) -> merge ->
      CoS clears the gate -> agent:implement. Mostly CoS duty 6, not
      router.yml, once the design PR itself is open.
    states: [needs_design_labeled, branch_cut, design_pr_opened,
             design_pr_merged, gate_cleared]
    transitions:
      - from: needs_design_labeled
        to: branch_cut
        trigger: "issues.labeled needs-design"
        actor: architect
        condition: "github.event.label.name == 'needs-design'"
        labels_add: ["status:in-progress"]
        source: "router.yml:1111-1112 design job; prompts/design.md:104-105"
      - from: branch_cut
        to: design_pr_opened
        actor: architect
        condition: "PR body MUST contain 'Gate-for: #<N>', MUST NOT contain 'Closes #N'"
        labels_add: ["status:in-review"]
        labels_remove: ["status:in-progress"]
        source: "prompts/design.md:67-69,106-107"
      - from: design_pr_opened
        to: design_pr_merged
        trigger: "approver merges (via review-loop flow, same as any PR)"
        actor: approver
        source: "flows.review-loop (design PRs go through the same review loop as code PRs)"
      - from: design_pr_merged
        to: gate_cleared
        trigger: "next CoS run reads recent_merged, finds Gate-for: #N"
        actor: chief-of-staff
        condition: "#N is open AND does not already carry agent:implement (idempotency check FIRST, before acting)"
        labels_remove: ["needs-design"]
        labels_add: ["agent:implement"]
        source: "agents/chief-of-staff/prompt.md duty 6 (L125-134)"

  content-flow:
    description: >
      Growth/SEO content -> project-repo ticket carrying channel:blog or
      channel:external + Originated-by: -> po-shape validates (positioning,
      claims, duplicate posts) -> blog: normal ticket-lifecycle (Engineer PR
      adds the post); external: awaiting-approval, approver posts by hand and
      closes.
    states: [content_ticket_opened, blog_ready, external_awaiting_approver,
             declined_or_backlogged]
    transitions:
      - from: content_ticket_opened
        to: blog_ready
        trigger: "issues.opened (Originated-by: in body) -> po-shape"
        actor: product-owner
        condition: "channel:blog AND classified SHAPED"
        labels_add: ["triaged:ready", "verdict:proceed"]
        source: "prompts/product-owner.md CONTENT TICKETS; continues as flows.ticket-lifecycle"
      - from: content_ticket_opened
        to: external_awaiting_approver
        trigger: "issues.opened (Originated-by: in body) -> po-shape"
        actor: product-owner
        condition: "channel:external AND PO approves the draft (never triaged:ready, never agent:implement)"
        labels_add: ["awaiting-approval", "verdict:proceed"]
        source: "prompts/product-owner.md CONTENT TICKETS"
      - from: content_ticket_opened
        to: declined_or_backlogged
        actor: product-owner
        condition: "off-positioning, false/hype claim, duplicate of an existing post or open ticket"
        labels_add: ["P3"]
        source: "prompts/product-owner.md VERDICT (verdict:backlog or verdict:decline)"

  override-flow:
    description: >
      Approver overrides a PO verdict, or approves/changes a NEEDS SHAPING
      proposal, outside the team-thread CONSENSUS path.
    states: [proposal_pending, tickets_cut, revised_proposal,
             parked, overridden, dispatched]
    transitions:
      - from: proposal_pending
        to: parked
        trigger: "PO VERDICT = BACKLOG or DECLINE"
        actor: product-owner
        labels_add: ["P3", "verdict:backlog", "verdict:decline"]
        note: >
          Exactly one of verdict:backlog/verdict:decline applies, plus P3.
          Issue stays open; a DECLINE with no approver reply is closed by
          the stuck sweeper after stuck_sweeper.decline_close_days. Modeled here as
          arising from proposal_pending (the common NEEDS SHAPING case) —
          per prompts/product-owner.md's Calibration section, a SHAPED
          ticket can also receive BACKLOG/DECLINE; this flow doesn't
          duplicate that branch, see flows.ticket-lifecycle's `shaped` note.
        source: "prompts/product-owner.md:138-149 VERDICT"
      - from: proposal_pending
        to: tickets_cut
        trigger: "issue_comment by non-Bot OWNER/MEMBER, approval or approver override reply"
        actor: po-continue
        labels_remove: ["proposal:pending"]
        labels_add: ["agent:implement", "needs-design"]
        note: "one of the two per the shaped plan; Shaped-from: #<idea> and After: #<n> links; idea issue closed 'Shaped into: <links>'"
        source: "router.yml:1412 po-continue job; prompts/product-owner.md:165-178"
      - from: proposal_pending
        to: revised_proposal
        trigger: "issue_comment, change request"
        actor: po-continue
        note: "posts a revised ## Proposal comment, proposal:pending stays"
        source: "prompts/product-owner.md ON APPROVAL/OVERRIDE, change-request path"
      - from: parked
        to: overridden
        trigger: >
          issue_comment by non-Bot OWNER/MEMBER on a verdict:backlog or
          verdict:decline issue, containing do-it-now or 'do it anyway'
        actor: po-continue
        labels_remove: ["P3", "verdict:backlog", "verdict:decline"]
        labels_add: ["verdict:overridden"]
        note: "removes whichever of verdict:backlog/verdict:decline was present; PO never re-argues the original call once overridden"
        source: "router.yml:1412 po-continue job; prompts/product-owner.md:179-187"
      - from: overridden
        to: dispatched
        trigger: "same run as the override"
        actor: po-continue
        note: >
          Executes the shaped plan if one exists, or applies agent:implement
          directly if the issue was SHAPED (triaged:ready, no proposal). CoS
          is a safety net only: if an overridden issue is somehow still
          undispatched on the next cycle, CoS adds triaged:ready rather than
          re-running a second full PO pass.
        source: "prompts/product-owner.md:179-187; agents/chief-of-staff/prompt.md (verdict:overridden safety net)"

##############################################################################
# LABEL STATES — which label set IS which flow state.
#
# The flows above name their states; this section pins each state to the
# exact set of STATE labels an open issue carries in it, so "what state is
# #N in?" and "is this label set even legal?" are answered by data, not by
# reading prompts. A combination no flow produces (e.g. debt-proposal +
# triaged:ready) is detected and repaired or escalated, never left to sit.
#
# Resolution, for an OPEN issue (closed issues are not checked):
#   1. Take its labels ∩ state_labels — everything else (dept:*, P*,
#      verdict:*, channel:*, risk:*, trigger labels like agent:shape) is
#      metadata and never decides the state.
#   2. Apply `repairs` (first match wins) — known-bad combinations with a
#      safe automatic fix, or an escalation when the fix is a approver call.
#   3. Look the set up in `combos`. No match -> strip `modifiers` one at a
#      time, in order, and retry. A modifier is a label that rides along on
#      top of a state without changing it.
#   4. Still no match -> the set is ILLEGAL. The stuck sweeper escalates it
#      (needs-human + comment naming the labels), never guesses.
#
# Consumers: src/squadhq/stuck_sweeper.py (ticket_state, normalize_issue),
# src/squadhq/flow_reader.py validate() (every label exists, every state exists
# in its flow, combos are unique, every non-escalating repair lands on a
# legal combo), src/squadhq/flow_diagram.py (renders the tables in
# docs/FLOW-DIAGRAM.md). Facts-dependent repairs (which side wins depends
# on whether a PR exists) stay in stuck_sweeper.normalize_issue code.
##############################################################################
label_states:
  issue:
    state_labels: [proposal:pending, triaged:ready, debt-proposal, debt, needs-design,
                   agent:implement, status:in-progress, status:in-review, needs-human]
    modifiers:
      - label: needs-human
        meaning: "parked on the approver; the underlying state is kept for when it is lifted"
      - label: debt
        meaning: "accepted tech debt — a kind of ticket, so it rides along once dispatched"
    combos:
      - {labels: [],                                     state: ticket-lifecycle.new,          meaning: "unshaped ticket, or not a ticket at all (report, content draft)"}
      - {labels: [proposal:pending],                     state: ticket-lifecycle.needs_shaping, meaning: "PO proposal awaiting team-thread / approver"}
      - {labels: [triaged:ready],                        state: ticket-lifecycle.shaped,       meaning: "shaped; the sweeper dispatches it into a free WIP slot"}
      - {labels: [debt-proposal],                        state: debt-intake.debt_proposal_created, meaning: "debt finding awaiting CoS intake"}
      - {labels: [debt],                                 state: debt-intake.accepted,          meaning: "accepted debt; dispatched like triaged:ready"}
      - {labels: [needs-design],                         state: ticket-lifecycle.needs_design, meaning: "Architect owes a design PR"}
      - {labels: [needs-design, status:in-progress],     state: ticket-lifecycle.in_progress,  meaning: "Architect writing the design"}
      - {labels: [needs-design, status:in-review],       state: ticket-lifecycle.in_review,    meaning: "design PR open"}
      - {labels: [agent:implement],                      state: ticket-lifecycle.dispatched,   meaning: "Engineer dispatched, not started"}
      - {labels: [agent:implement, status:in-progress],  state: ticket-lifecycle.in_progress,  meaning: "Engineer working"}
      - {labels: [agent:implement, status:in-review],    state: ticket-lifecycle.in_review,    meaning: "PR open (or report delivered)"}
      - {labels: [status:in-review],                     state: ticket-lifecycle.in_review,    meaning: "report ticket delivered, waiting for the approver to close it"}
      - {labels: [needs-human],                          state: ticket-lifecycle.needs_human,  meaning: "approver's call"}
    # Each repair matches when EVERY group has at least one label present
    # and no `unless` label is present. remove/add touch only what applies.
    repairs:
      - groups: [[verdict:backlog, verdict:decline, P3], [agent:implement, needs-design, triaged:ready]]
        unless: [verdict:overridden]
        escalate: true
        reason: "parked (backlog/decline/P3) AND dispatched — either the park or the dispatch is wrong, and that is the approver's call."
      - groups: [[debt-proposal], [triaged:ready]]
        unless: [verdict:backlog, verdict:decline, P3]
        remove: [debt-proposal, triaged:ready]
        add: [debt]
        reason: "a `debt-proposal` marked `triaged:ready` is accepted debt — relabelled to `debt` so it can dispatch."
      - groups: [[debt-proposal], [debt]]
        remove: [debt-proposal]
        reason: "already accepted as `debt` — the proposal label is stale."
      - groups: [[proposal:pending], [triaged:ready]]
        unless: [agent:implement, needs-design]
        escalate: true
        reason: "both `proposal:pending` (needs shaping) and `triaged:ready` (shaped) — the PO has to settle which."
      - groups: [[triaged:ready, debt-proposal], [agent:implement, needs-design]]
        remove: [triaged:ready, debt-proposal]
        reason: "already dispatched — `triaged:ready` is the step before dispatch."
      - groups: [[proposal:pending], [agent:implement, needs-design]]
        remove: [proposal:pending]
        reason: "already dispatched — the proposal stage is over."
    # Documentation only: repairs whose winner depends on PR facts, so they
    # live in stuck_sweeper.normalize_issue code. Listed here so the
    # generated doc shows every automatic repair in one place.
    fact_repairs:
      - when: "`agent:implement` + `needs-design`"
        action: "design PR merged -> remove `needs-design`; otherwise remove `agent:implement` (design first)"
      - when: "`status:in-progress` + `status:in-review`"
        action: "PR open -> remove `status:in-progress`; otherwise remove `status:in-review`"
  pr:
    # Risk labels are metadata (they never decide the
    # state) but EXCLUSIVE: merge_policy reads exactly one risk:*, so two at
    # once fails every auto-merge closed until someone notices.
    state_labels: [ready-to-merge, review:changes-requested, needs-approver-merge, needs-human,
                   status:in-progress, status:in-review]
    exclusive:
      - [risk:low, risk:medium, risk:high]
    modifiers:
      - label: needs-human
        meaning: "parked on the approver (fix-round cap hit, stuck re-fires); the review state is kept"
    combos:
      - {labels: [],                                       state: review-loop.review_pending, meaning: "opened — CI and review pending (or review in progress)"}
      - {labels: [review:changes-requested],               state: review-loop.changes_requested, meaning: "Reviewer asked for changes; the fix round runs"}
      - {labels: [ready-to-merge],                         state: review-loop.approved,       meaning: "Reviewer approved; self-merge deciding, or auto-merge armed and waiting on ci-gate"}
      - {labels: [ready-to-merge, needs-approver-merge],    state: review-loop.approved,       meaning: "approved but not auto-mergeable (risk above low, human-authored, failed check) — waiting on the approver's click"}
      - {labels: [needs-human],                            state: review-loop.needs_human,    meaning: "approver's call"}
    repairs:
      - groups: [[status:in-progress, status:in-review]]
        remove: [status:in-progress, status:in-review]
        reason: "`status:*` labels track the ISSUE; on a PR they are noise the board and readers misread."
      - groups: [[needs-approver-merge]]
        unless: [ready-to-merge]
        remove: [needs-approver-merge]
        reason: "`needs-approver-merge` without an approval (`ready-to-merge`) is stale."
    fact_repairs:
      - when: "`ready-to-merge` + `review:changes-requested`"
        action: "latest verdict wins (label events): newer REQUEST CHANGES -> remove `ready-to-merge` and `needs-approver-merge`; newer APPROVE -> remove `review:changes-requested`"
      - when: "two or more `risk:*`"
        action: "keep the most recently applied risk label (the Reviewer's latest verdict), remove the rest"

##############################################################################
# ROLES — every badge-carrying persona. `authority` is a whitelist: an
# agent CANNOT perform an action type or touch a repo scope not listed
# here. `hard_limits` are numeric ceilings enforced at minimum by prompt
# instruction; "enforced_in_code: true" marks the subset also enforced by
# src/squadhq/agent_runner.py itself (belt-and-suspenders, not prompt-only).
##############################################################################
roles:
  chief-of-staff:
    badge: "[Chief of Staff] "
    authority:
      action_types: [create_issue, comment, add_labels, remove_labels, close_issue]
      repos: [hub, project]
      note: "Never creates cross-project tickets on its own — cross-project work becomes an hq escalation issue instead."
    hard_limits:
      max_actions_per_run: {value: 20, enforced_in_code: true, source: "src/squadhq/agent_runner.py:626 execute() batch=actions[:20]; agents/chief-of-staff/prompt.md:163"}
      wip_limit_open_prs_per_project: {value: 5, raised_from: 3, source: "agents/chief-of-staff/prompt.md duty 2 (L75-77); also referenced by prompts/product-owner.md", note: "Raised from 3 to 5 with stacked-PR support and risk-based auto-merge — low-risk PRs clear faster, freeing slots. A stack of 3 counts as 3 slots, not 1."}
      resurface_max_per_day: {value: 1, source: "agents/chief-of-staff/prompt.md duty 8"}
      capacity_refire_max_per_cycle: {value: 1, source: "agents/chief-of-staff/prompt.md duty 9"}
      hygiene_check_cap_per_run: {value: 10, source: "agents/chief-of-staff/prompt.md duty 5"}
      stall_threshold_hours: {value: 2, source: "agents/chief-of-staff/prompt.md duty 5"}
      unblock_stale_threshold_hours: {value: 24, source: "agents/chief-of-staff/prompt.md duty 4 (\"older than a day\")"}
      transient_exhausted_stale_close_hours: {value: 4, source: "agents/chief-of-staff/prompt.md duty 5"}
      report_originated_flood_pacing: {value: "if >5 report-originated tickets arrive in one day, dispatch at most 2/cycle", source: "agents/chief-of-staff/prompt.md"}
      debt_refactor_share_target: {value: "~20%", source: "agents/chief-of-staff/prompt.md duty 3"}
      stacked_ticket_dispatch: {value: "dispatch 'After: #N' tickets in order — only once #N has an open or merged PR; each ticket in a stack counts as its own WIP slot", source: "agents/chief-of-staff/prompt.md duty 2", note: "Duplicated into the prompt on purpose: the CoS runs on src/squadhq/agent_runner.py with no file access, so it reads this via flow_reader.context_slice_for_role's hard_limits, not by opening flows.yml."}
    idempotency: [label-before-add, duplicate-comment-24h, gate-clear-guard, merge-state-only-closures]
    source: "agents/chief-of-staff/prompt.md"

  daily-brief:
    badge: "[Daily Brief] "
    authority:
      action_types: [create_issue]
      repos: [hub]
      note: "DIGEST role — never creates tickets from its own findings. A gap it notices is reported as 'Gap noticed: ... — no ticket exists for this', never ticketed directly."
    hard_limits:
      max_actions_per_run: {value: 1, source: "agents/daily-brief/prompt.md L3-4,19 — hard contract"}
    idempotency: [merge-state-only-closures]
    source: "agents/daily-brief/prompt.md; src/squadhq/agent_runner.py MODE_BADGE"

  weekly-rollup:
    badge: "[Weekly Rollup] "
    authority:
      action_types: [create_issue]
      repos: [hub]
      note: "DIGEST role, same non-origination rule as daily-brief."
    hard_limits:
      max_actions_per_run: {value: 1, source: "agents/rollup/prompt.md L8-14,16-17"}
      body_length: {value: "<=1 page", source: "agents/rollup/prompt.md L21"}
    idempotency: [merge-state-only-closures]
    # Badge format note: agents/rollup/prompt.md specifies the badge as the
    # literal FIRST LINE of the body rather than an inline "[Role] " prefix
    # (agents/growth, agents/seo, agents/legal, agents/finance,
    # agents/chief-of-staff, agents/daily-brief all use inline-prefix
    # instead). Both forms satisfy org/CLAUDE-org.md's IDENTITY rule
    # ("must begin with your role badge") — not a real conflict, just a
    # stylistic variant. Documented here rather than silently normalized;
    # not worth a behavior-risking prompt edit for a purely cosmetic gap.
    source: "agents/rollup/prompt.md; src/squadhq/agent_runner.py MODE_BADGE"

  growth:
    badge: "[Growth] "
    authority:
      action_types: [create_issue]
      repos: [hub, project]
      note: "Content drafts, feature opportunities AND the 'nothing new' / overflow report -> project repo (content carries channel:blog or channel:external, flows.content-flow; the report carries report + dept:growth). Nothing goes to the hub. Never posts content itself (manual approver approval required — see org/CLAUDE-org.md Self-actuation policy)."
    hard_limits:
      draft_cap_per_run: {value: 3, condition: "kill score < 7", source: "agents/growth/prompt.md L11,16"}
      self_actuation_ticket_cap_per_run: {value: 3, source: "agents/growth/prompt.md L49-50 FLOOD GUARD"}
    idempotency: [duplicate-comment-24h]
    source: "agents/growth/prompt.md"

