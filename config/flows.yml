    hard_limits:
      self_actuation_ticket_cap_per_run: {value: 3, source: "agents/ecosystem-watch/prompt.md L107-110 FLOOD GUARD"}
      web_search_soft_minimum: {value: "10-20+ searches", source: "agents/ecosystem-watch/prompt.md L11"}
      action_required_severity_high_deadline_days: {value: 30, note: "severity:high if the action-required item's deadline is under this many days", source: "agents/ecosystem-watch/prompt.md L95-96"}
      recommended_update_effort_ceiling_days: {value: 1, note: "a recommended-update item only becomes a ticket if effort is at or under this", source: "agents/ecosystem-watch/prompt.md L100"}
    idempotency: [dedup-before-create]
    # CONFLICT: unlike the debt scanners, this
    # prompt had NO "search existing tickets before creating" step — a
    # persistent unresolved Action-required item could get a fresh
    # duplicate ticket every Saturday. Resolution: applied the debt
    # scanner's stricter dedup-before-create pattern here too (see
