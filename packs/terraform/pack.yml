id: terraform
name: Terraform / OpenTofu (IaC)
detect:
  files: ["*.tf", "*.tofu", ".terraform.lock.hcl", "terragrunt.hcl"]
paths:
  - "**/*.tf"
  - "**/*.tfvars"
  - "**/*.tofu"
  - "**/.terraform.lock.hcl"
  - "**/terragrunt.hcl"
root: "."
ci:
  setup:
    kind: none
    version: ""
  # Terraform is not guaranteed on runners; a dedicated setup kind is needed.
  # Validation never touches remote state or cloud credentials.
  install: "mkdir -p \"$HOME/bin\" && curl -fsSL https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip -o /tmp/tf.zip && unzip -o -q /tmp/tf.zip -d \"$HOME/bin\" && export PATH=\"$HOME/bin:$PATH\""
  lint:
    command: "export PATH=\"$HOME/bin:$PATH\" && terraform fmt -check -recursive"
    local: "terraform fmt -check -recursive"
    requires_config: false
  build: "export PATH=\"$HOME/bin:$PATH\" && for d in $(find . -name '*.tf' -not -path '*/.terraform/*' | xargs -n1 dirname | sort -u); do terraform -chdir=\"$d\" init -backend=false -input=false >/dev/null && terraform -chdir=\"$d\" validate || exit 1; done"
  test: ""
  coverage:
    format: none
    path: ""
    min_overall: 0
    min_changed: 0
risk_paths:
  - "**/*.tf"
  - "**/*.tfvars"
  - "**/.terraform.lock.hcl"
  - "**/terragrunt.hcl"
tools:
  - "Bash(terraform fmt*)"
  - "Bash(terraform validate*)"
  - "Bash(terraform init -backend=false*)"
  - "Bash(tofu fmt*)"
  - "Bash(tofu validate*)"
  - "Bash(tflint*)"
  - "Bash(checkov *)"
  - "Bash(trivy config *)"
