; import-linter contracts seeded by Agent Squad HQ (pack python-django).
;
; Tool:  import-linter 2.15. The hub's "arch" gate installs exactly that
;        version and runs `lint-imports --config .importlinter` whenever this
;        file exists. Locally: uv pip install import-linter==2.15
;
; TODO(owner): list the project's top-level packages under root_packages and
; its Django apps under containers. Each app is layered views -> services ->
; models; layers in parentheses are optional. Record it in an ADR.

[importlinter]
root_packages =
    myapp
include_external_packages = True

[importlinter:contract:app-layers]
name = Per app: views -> services -> models (never the reverse)
type = layers
containers =
    myapp
layers =
    (views)
    (services)
    (models)

[importlinter:contract:models-are-not-http]
name = Models do not depend on URL routing, views or the REST layer
type = forbidden
source_modules =
    myapp.models
forbidden_modules =
    myapp.urls
    myapp.views
    rest_framework
