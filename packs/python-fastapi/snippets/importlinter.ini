; import-linter contracts seeded by Agent Squad HQ (pack python-fastapi).
;
; Tool:  import-linter 2.15. The hub's "arch" gate installs exactly that
;        version and runs `lint-imports --config .importlinter` whenever this
;        file exists. Locally: uv pip install import-linter==2.15
;
; TODO(owner): set root_package to this project's top-level package and
; rename the layers to match it. Layers in parentheses are optional (they
; may not exist yet). Record the layering in an ADR under docs/adr/.

[importlinter]
root_package = app
include_external_packages = True

[importlinter:contract:layers]
name = Layers: api -> services -> domain (higher layers may import lower ones, never the reverse)
type = layers
layers =
    app.api
    (app.services)
    app.domain

[importlinter:contract:domain-is-pure]
name = The domain imports no web framework, ORM or infrastructure code
type = forbidden
source_modules =
    app.domain
forbidden_modules =
    fastapi
    starlette
    sqlalchemy
allow_indirect_imports = True
