id: kotlin-android
name: Android (Kotlin, Gradle)
detect:
  files: ["AndroidManifest.xml", "proguard-rules.pro"]
paths:
  - "**/*.kt"
  - "**/*.java"
  - "**/src/main/res/**"
  - "**/AndroidManifest.xml"
  - "**/build.gradle.kts"
  - "**/build.gradle"
  - "settings.gradle*"
  - "gradle/libs.versions.toml"
root: "."
ci:
  setup:
    kind: java
    version: "17"
  install: ""
  # Android SDK is preinstalled on GitHub-hosted Ubuntu runners. Coverage via
  # Kover (kotlinx-kover) producing JaCoCo-compatible XML.
  build: "./gradlew assembleDebug --continue"
  lint:
    command: "./gradlew lintDebug --continue"
    local: "./gradlew lintDebug"
    requires_config: false
  test: "./gradlew testDebugUnitTest koverXmlReportDebug"
  coverage:
    format: jacoco
    path: "app/build/reports/kover/reportDebug.xml"
    min_overall: 50
    min_changed: 70
risk_paths:
  - "**/AndroidManifest.xml"
  - "**/res/xml/network_security_config.xml"
  - "**/proguard-rules.pro"
  - "**/auth/**"
  - "**/security/**"
  - "**/billing/**"
  - "**/*keystore*"
  - "**/signing*"
  - "**/google-services.json"
tools:
  - "Bash(./gradlew *)"
