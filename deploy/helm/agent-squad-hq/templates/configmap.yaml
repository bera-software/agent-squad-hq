{{- if not .Values.existingConfigMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "squadhq.configMapName" . }}
  labels:
    {{- include "squadhq.labels" . | nindent 4 }}
  {{- if .Values.migrations.enabled }}
  annotations:
    # created before the migrate hook so the hook pod can mount it
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/resource-policy": keep
  {{- end }}
data:
  squadhq.yml: |
    {{- .Values.squadhqYml | nindent 4 }}
{{- end }}
