{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "squadhq.secretName" . }}
  labels:
    {{- include "squadhq.labels" . | nindent 4 }}
  {{- if .Values.migrations.enabled }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/resource-policy": keep
  {{- end }}
type: Opaque
stringData:
  {{- required "secrets.values.SQUADHQ_DB_URL is required when secrets.existingSecret is empty" .Values.secrets.values.SQUADHQ_DB_URL | printf "SQUADHQ_DB_URL: %q" | nindent 2 }}
  {{- range $k, $v := .Values.secrets.values }}
  {{- if ne $k "SQUADHQ_DB_URL" }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
{{- end }}
